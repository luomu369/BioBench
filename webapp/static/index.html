<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioBench Viewer</title>
<script src="3Dmol-min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #131a22;
    --border: #223040;
    --text: #dbe6f0;
    --muted: #7d8fa3;
    --accent: #4da3ff;
    --ok: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ---------- viewer ---------- */
  #viewer-wrap {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #16202b 0%, #0b0f14 70%);
  }
  #viewer { width: 100%; height: 100%; }
  /* Follows the cursor over the canvas and names the residue under it. */
  #hover-tip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    background: rgba(13,18,25,.92);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text);
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
  }
  #hover-tip .ht-res { font-weight: 600; }
  #hover-tip .ht-chain { color: var(--muted); margin-left: 6px; }
  #hover-tip .ht-sel { color: var(--accent); margin-left: 6px; }
  #viewer-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  #viewer-hint.hidden { display: none; }
  #viewer-hint .big { font-size: 18px; color: var(--text); }
  #viewer-hint .small { font-size: 13px; max-width: 460px; line-height: 1.7; }
  #viewer-hint code {
    background: rgba(10,14,19,.8);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--accent);
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctl {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(19,26,34,.72);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 30px 7px 14px;
    cursor: pointer;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237d8fa3'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 15px;
    transition: border-color .15s;
  }
  .ctl:hover { border-color: rgba(77,163,255,.5); }
  .ctl:disabled { opacity: .45; cursor: default; }
  .ctl option { background: #131a22; color: var(--text); }
  .ctl.icon {
    padding: 7px;
    width: 32px; height: 32px;
    background-image: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctl.icon svg { width: 15px; height: 15px; fill: var(--muted); }
  .ctl.icon:hover svg { fill: var(--text); }

  /* ---------- structure label ---------- */
  #structure-label {
    position: absolute;
    top: 14px; left: 16px;
    background: rgba(11,15,20,.72);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: none;
    backdrop-filter: blur(8px);
  }
  #structure-label.show { display: block; }
  #structure-label .src { color: var(--accent); }

  /* ---------- metrics panel ---------- */
  /* ---------- left column: metrics + sequence ---------- */
  #left-col {
    position: absolute;
    top: 58px; left: 16px;
    z-index: 10;
    width: min(400px, calc(100% - 300px));
    max-height: calc(100% - 120px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
  }
  #left-col:empty { display: none; }

  #metrics {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    flex-shrink: 0;
  }
  #metrics.show { display: block; }
  #metrics .m-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #metrics .m-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 13px;
    padding: 2px 0;
  }
  #metrics .m-row .k { color: var(--muted); }
  #metrics .m-row .v { font-variant-numeric: tabular-nums; }
  /* Unit / direction hint, dimmed so the number still leads. */
  #metrics .m-hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 7px;
    opacity: .8;
  }
  #metrics .m-notes {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(34,48,64,.7);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- sequence panel ---------- */
  #seq-panel {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
    /* Taller than the old 220px so a dozen chains fit, but capped so the
       panel scrolls instead of swallowing the whole left column. */
    max-height: 420px;
    overflow: auto;
    flex-shrink: 0;
  }
  #seq-panel.show { display: block; }
  #seq-panel .seq-head {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  #seq-panel .seq-body {
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    word-break: break-all;
    white-space: pre-wrap;
  }
  #seq-panel .seq-chain { margin-bottom: 10px; }
  #seq-panel .seq-chain:last-child { margin-bottom: 0; }
  #seq-panel .seq-chain-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  #seq-panel .seq-chain-name { letter-spacing: .02em; }
  #seq-panel .seq-eye {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    line-height: 1;
    color: #ffffff;
    opacity: .55;
    display: inline-flex;
    align-items: center;
  }
  #seq-panel .seq-eye svg { width: 13px; height: 13px; fill: currentColor; }
  #seq-panel .seq-eye:hover { opacity: 1; }
  #seq-panel .seq-eye.off { color: var(--muted); opacity: .8; }
  #seq-panel .seq-chain-seq { color: var(--text); }

  /* ---------- state.selection panel ---------- */
  #selection {
    position: absolute;
    right: 16px; top: 58px;
    z-index: 10;
    width: 230px;
    max-height: calc(100% - 140px);
    overflow: auto;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
  }
  #selection.show { display: block; }
  /* Two rows: the title, then the mode switch and clear. One row crammed
     four mode buttons and "clear all" against the title and wrapped. */
  #selection .s-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #selection .s-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 10px;
  }
  #selection .s-clear {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    text-transform: none;
    letter-spacing: 0;
  }
  #selection .s-clear:hover { text-decoration: underline; }
  #selection .s-mode {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #selection .s-mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 3px 8px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #selection .s-mode-btn:hover { color: var(--text); }
  #selection .s-mode-btn.on {
    background: rgba(77,163,255,.18);
    color: var(--accent);
  }
  #selection .s-empty { font-size: 12px; color: var(--muted); line-height: 1.6; }
  #selection .s-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #selection .s-row:hover { background: rgba(77,163,255,.1); }
  #selection .s-swatch {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #selection .s-name { flex: 1; font-family: ui-monospace, Menlo, monospace; }
  #selection .s-del {
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #selection .s-del:hover { color: var(--err); }

  /* ---------- status bar ---------- */
  #status {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(19,26,34,.82);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 13px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 0 1px rgba(77,163,255,.08);
    max-width: calc(100% - 32px);
  }
  #status[data-state="running"] {
    border-color: rgba(77,163,255,.45);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 18px rgba(77,163,255,.18);
  }
  #status[data-state="done"] { border-color: rgba(74,222,128,.45); }
  #status[data-state="error"] { border-color: rgba(248,113,113,.45); }
  #status.show { display: flex; }
  #status .dot {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(125,143,163,.35);
    border-top-color: var(--muted);
    flex-shrink: 0;
  }
  #status[data-state="running"] .dot {
    border-color: rgba(77,163,255,.25);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  #status[data-state="done"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--ok);
    border-radius: 50%;
    /* checkmark via clip-path */
    clip-path: polygon(
      14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  #status[data-state="error"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--err);
    border-radius: 50%;
    clip-path: polygon(
      20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%,
      50% 70%, 80% 100%, 100% 80%, 70% 50%,
      100% 20%, 80% 0%, 50% 30%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status .msg { color: var(--text); }
  #status[data-state="error"] .msg { color: var(--err); }
  #status .bar {
    width: 120px; height: 6px;
    background: rgba(34,48,64,.9);
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #status .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #2b7fd4, var(--accent));
    width: 0%;
    transition: width .5s ease;
    background-size: 20px 20px;
    background-image: linear-gradient(
      135deg,
      rgba(255,255,255,.22) 25%, transparent 25%,
      transparent 50%, rgba(255,255,255,.22) 50%,
      rgba(255,255,255,.22) 75%, transparent 75%);
    animation: stripes 1s linear infinite;
  }
  @keyframes stripes {
    from { background-position: 0 0; }
    to   { background-position: 20px 0; }
  }
  #status[data-state="done"] .bar > div {
    background: var(--ok);
    background-image: none;
    animation: none;
  }
  #status[data-state="error"] .bar > div {
    background: var(--err);
    background-image: none;
    animation: none;
  }
  #status .step { color: var(--muted); font-size: 12px; flex-shrink: 0; }

  /* ---------- structure tabs ---------- */
  /* One tab per structure the viewer has loaded this session, so results
     from different runs stay side by side instead of replacing each other.
     Sits above the status bar, below the top controls. */
  #tabs {
    position: absolute;
    top: 58px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: none;
    align-items: center;
    gap: 6px;
    max-width: calc(100% - 32px);
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
  }
  #tabs.show { display: flex; }
  #tabs::-webkit-scrollbar { display: none; }
  /* The bar floats over the viewer canvas. Without this a click on a tab
     also reaches 3Dmol underneath, which treats it as an atom click and
     rewrites the state.selection before switchTab can save it. */
  #tabs .tab { pointer-events: auto; }
  #tabs .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(19,26,34,.72);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12px;
    padding: 5px 8px 5px 12px;
    cursor: pointer;
    white-space: nowrap;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: border-color .15s, color .15s;
  }
  #tabs .tab:hover { border-color: rgba(77,163,255,.5); color: var(--text); }
  #tabs .tab.on {
    border-color: rgba(77,163,255,.6);
    color: var(--text);
    background: rgba(30,41,59,.85);
  }
  #tabs .tab .t-src { color: var(--accent); font-size: 11px; }
  #tabs .tab .t-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
    border-radius: 50%;
  }
  #tabs .tab .t-close:hover { color: var(--err); }
</style>
</head>
<body>

<div id="tabs"></div>

<div id="viewer-wrap">
  <div id="viewer"></div>
  <div id="hover-tip" hidden></div>
  <div id="viewer-hint">
    <div class="big">No structure loaded</div>
    <div class="small">
      Ask your agent to run a BioBench skill, e.g.
      <em>"design a binder for NK2R"</em> or <em>"show me 7xwo"</em>.
      Results appear here automatically.
    </div>
  </div>
</div>

<div id="structure-label"></div>

<div id="topbar">
    <select id="style-picker" class="ctl" disabled>
      <option value="surface">Surface</option>
      <option value="cartoon">Cartoon</option>
      <option value="stick">Stick</option>
      <option value="sphere">Sphere</option>
      <option value="line">Line</option>
    </select>
    <select id="color-picker" class="ctl" disabled>
      <option value="chain">By chain</option>
      <option value="spectrum">Spectrum</option>
      <option value="secondary">Secondary</option>
    </select>
    <select id="ligand-style-picker" class="ctl" disabled title="Ligand rendering">
      <option value="stick">Stick</option>
      <option value="ballstick">Ball &amp; stick</option>
      <option value="spacefill">Space fill</option>
      <option value="line">Line</option>
    </select>
    <button id="reset-btn" class="ctl icon" disabled title="Reset view">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97-.7-2.8L3.84 11.66C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" opacity="0"/><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="selection">
    <div class="s-head">
      <span>Selection</span>
      <button class="s-clear" id="sel-clear">clear all</button>
    </div>
    <div class="s-tools">
      <span class="s-mode" id="sel-mode" title="What a click selects: a residue, a whole chain, a single atom, or a bond">
        <button class="s-mode-btn on" data-mode="res">Res</button>
        <button class="s-mode-btn" data-mode="chain">Chain</button>
        <button class="s-mode-btn" data-mode="atom">Atom</button>
        <button class="s-mode-btn" data-mode="bond">Bond</button>
      </span>
    </div>
    <div id="sel-list"></div>
  </div>

<div id="left-col">
  <div id="metrics">
    <div class="m-title">Metrics</div>
    <div id="metrics-rows"></div>
    <div class="m-notes" id="metrics-notes"></div>
  </div>

  <div id="seq-panel">
    <div class="seq-head">
      <span id="seq-title">Sequence</span>
      <span id="seq-len"></span>
    </div>
    <div class="seq-body" id="seq-body"></div>
  </div>
</div>

<div id="status">
  <span class="dot"></span>
  <span class="msg"></span>
  <span class="bar"><div></div></span>
  <span class="step"></span>
</div>

<script>
// A browser caps the number of live WebGL contexts (~16 in Chrome). Each
// 3Dmol viewer holds one, so a page that has created and abandoned many
// viewers — or several tabs of this app — eventually gets null back from
// getContext and the canvas stays blank with no explanation. Detect that
// and say so, with the fix.
function webglAvailable() {
  try {
    const c = document.createElement("canvas");
    return !!(c.getContext("webgl2") || c.getContext("webgl"));
  } catch (e) {
    return false;
  }
}

const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "0b0f14" });

/* ================= state =================
 *
 * Everything mutable lives here. The viewer previously kept eight
 * top-level variables — selection, hiddenChains, tabs, activeTab, chains,
 * state.meta, lastUpdated, state.structureName — and every one of them was
 * read and written from several unrelated functions. That is what made the
 * tab bugs so hard to pin down: a state.selection could be saved, cleared, and
 * repainted by three different callers with no single place to look.
 *
 * One object, mutated only through the helpers below, so the question
 * "what is selected right now" has exactly one answer.
 */
const state = {
  /** Chains of the loaded structure: [{chain, seq, residues}] */
  chains: [],
  /** current.json of the active structure */
  meta: {},
  /** Timestamp of the contract file the active tab was loaded from */
  lastUpdated: null,
  /** Timestamp last seen in current.json, independent of which tab is shown */
  contractUpdated: null,
  /** Name of the active structure, for selection.json */
  structureName: null,
  /** key → {sel, label, color, chain?, atom?, bond?, pocket?} */
  selection: {},
  /** Chain IDs hidden by the eye toggles */
  hiddenChains: new Set(),
  /** "res" | "chain" | "atom" | "bond" */
  selMode: "res",
  /** Loaded structures: [{text, meta, state}] */
  tabs: [],
  /** Index into tabs of the structure on screen */
  activeTab: -1,
};

// Snapshot the per-structure part of the state, so a tab can restore it.
function captureState() {
  return {
    selection: JSON.parse(JSON.stringify(state.selection)),
    hiddenChains: [...state.hiddenChains],
  };
}

// Install a snapshot taken by captureState. Called before anything reads
// the state.selection — applyStyle() paints from it, so restoring afterwards
// leaves the previous structure's highlights on screen.
function restoreState(snap) {
  state.selection = snap && snap.selection ? snap.selection : {};
  state.hiddenChains = new Set(snap && snap.hiddenChains ? snap.hiddenChains : []);
}

if (!webglAvailable()) {
  const hint = document.getElementById("viewer-hint");
  hint.classList.remove("hidden");
  hint.innerHTML =
    '<div class="big">3D 渲染不可用</div>' +
    '<div class="small">浏览器已达到 WebGL 上下文上限。' +
    '关闭其他标签页后刷新此页面即可恢复。</div>';
}

const hint = document.getElementById("viewer-hint");
const label = document.getElementById("structure-label");
const metricsPanel = document.getElementById("metrics");
const metricsRows = document.getElementById("metrics-rows");
const metricsNotes = document.getElementById("metrics-notes");
const seqPanel = document.getElementById("seq-panel");
const seqTitle = document.getElementById("seq-title");
const seqLen = document.getElementById("seq-len");
const seqBody = document.getElementById("seq-body");
const statusBar = document.getElementById("status");

const AA3TO1 = {
  ALA:'A', ARG:'R', ASN:'N', ASP:'D', CYS:'C', GLN:'Q', GLU:'E', GLY:'G',
  HIS:'H', ILE:'I', LEU:'L', LYS:'K', MET:'M', PHE:'F', PRO:'P', SER:'S',
  THR:'T', TRP:'W', TYR:'Y', VAL:'V',
  MSE:'M', SEC:'U', PYL:'O', HYP:'P', SEP:'S', TPO:'T', PTR:'Y'
};

/* ---------------- structure rendering ---------------- */

function extractChains(model) {
  if (!model || !model.selectedAtoms) return [];
  let atoms = [];
  try { atoms = model.selectedAtoms({}) || []; } catch (e) { return []; }

  const byChain = new Map();
  atoms.forEach(a => {
    if (!a) return;
    const one = AA3TO1[(a.resn || "").toUpperCase()];
    if (!one) return;
    const chain = a.chain || "_";
    if (!byChain.has(chain)) byChain.set(chain, new Map());
    const residues = byChain.get(chain);
    const key = a.resi != null ? a.resi : a.serial;
    if (!residues.has(key)) residues.set(key, one);
  });

  return [...byChain.entries()].map(([chain, residues]) => ({
    chain,
    seq: [...residues.values()].join(""),
    residues: [...residues.keys()]
  }));
}

// Chains the user has hidden. Kept across style/state.selection changes so
// hiding survives a re-render; restored per tab when switching.
function chainHidden(chainId) {
  return state.hiddenChains.has(chainId);
}

// Eye / eye-off icons. Inline SVG rather than emoji so the colour can be
// controlled and the glyph stays crisp at 13px.
const EYE_ON =
  '<svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>';
const EYE_OFF =
  '<svg viewBox="0 0 24 24"><path d="M2 4.3 3.4 3 21 20.6 19.6 22l-3.1-3.1A11 11 0 0 1 12 19c-5 0-9.3-3.1-11-7a12.6 12.6 0 0 1 4.2-5.2L2 4.3zM12 7a5 5 0 0 1 4.7 6.7l-2-2A3 3 0 0 0 10.3 9.3l-2-2A5 5 0 0 1 12 7zm10 5c-.6 1.4-1.6 2.7-2.9 3.8l-1.5-1.5A9.9 9.9 0 0 0 19.4 12a9.8 9.8 0 0 0-4.4-4.3l-1.5-1.5A11 11 0 0 1 12 5c5 0 9.3 3.1 11 7z"/></svg>';

// One row per chain: an eye toggle on the left, the chain name, and the
// sequence underneath. Clicking the eye hides that chain in the 3D view.
function chainRow(chainId, label, seqText) {
  const row = document.createElement("div");
  row.className = "seq-chain";

  const head = document.createElement("div");
  head.className = "seq-chain-head";

  const hidden = chainHidden(chainId);
  const eye = document.createElement("button");
  eye.className = "seq-eye" + (hidden ? " off" : "");
  eye.type = "button";
  eye.title = hidden ? "Show this chain" : "Hide this chain";
  eye.innerHTML = hidden ? EYE_OFF : EYE_ON;
  eye.addEventListener("click", () => {
    if (state.hiddenChains.has(chainId)) {
      state.hiddenChains.delete(chainId);
    } else {
      state.hiddenChains.add(chainId);
    }
    applyStyle();
    renderSequence(null);
  });

  const name = document.createElement("span");
  name.className = "seq-chain-name";
  name.textContent = label;

  head.append(eye, name);
  row.appendChild(head);

  if (seqText) {
    const body = document.createElement("div");
    body.className = "seq-chain-seq";
    body.textContent = seqText;
    row.appendChild(body);
  }
  return row;
}

function renderSequence(chainInfo) {
  if (!chainInfo) {
    // "All chains" selected — one block per chain, each with its own hide
    // toggle. Ligand chains carry no amino acids so extractChains skips
    // them; take them from the metadata so every chain on screen is listed.
    const ligandChains = (state.meta.chains || []).filter(c => c.ligand);
    if (!state.chains.length && !ligandChains.length) {
      seqPanel.classList.remove("show");
      return;
    }
    seqTitle.textContent = "All chains";
    seqLen.textContent = `${state.chains.length + ligandChains.length} chains`;
    seqBody.innerHTML = "";
    state.chains.forEach(c => {
      const role = ((state.meta.chains || []).find(m => m.id === c.chain) || {}).role;
      const label = `Chain ${c.chain}${role ? " — " + role : ""}  (${c.seq.length} aa)`;
      seqBody.appendChild(chainRow(c.chain, label, c.seq));
    });
    ligandChains.forEach(c => {
      const label = `Ligand ${c.id}${c.role ? " — " + c.role : ""}  (${c.residues} res)`;
      seqBody.appendChild(chainRow(c.id, label, ""));
    });
    seqPanel.classList.add("show");
    return;
  }
  seqTitle.textContent = `Chain ${chainInfo.chain}`;
  seqLen.textContent = `${chainInfo.seq.length} residues`;
  seqBody.innerHTML = "";
  seqBody.appendChild(chainRow(
    chainInfo.chain,
    `Chain ${chainInfo.chain}  (${chainInfo.seq.length} aa)`,
    chainInfo.seq));
  seqPanel.classList.add("show");
}

// Metrics come from many tools and span wildly different scales — an
// e-value of 1.4e-30 and a bit score of 1516 both have to stay readable.
// toFixed(3) turns the former into "0.000", so very small and very large
// magnitudes fall back to exponential / compact notation.
function formatMetric(v) {
  if (typeof v !== "number") return String(v);
  if (v === 0) return "0";
  const abs = Math.abs(v);
  if (abs < 0.001 || abs >= 1e6) return v.toExponential(2);
  if (Number.isInteger(v)) return String(v);
  return v.toFixed(abs < 1 ? 3 : 1);
}

// A metric entry is either a bare value or an object the skill wrote
// itself:
//   {"label": "ri 柔性对接", "value": -9.12, "hint": "kcal/mol，越负越强"}
// The viewer keeps no vocabulary of its own — the skill names its metrics
// and decides how much to explain. A bare number still renders, so a
// quick publish never has to invent a label.
function metricParts(key, entry) {
  if (entry && typeof entry === "object" && !Array.isArray(entry)) {
    return {
      label: entry.label || key,
      value: "value" in entry ? entry.value : "",
      hint: entry.hint || ""
    };
  }
  return { label: key, value: entry, hint: "" };
}

function renderMetrics(meta) {
  const m = meta.metrics || {};
  const keys = Object.keys(m);
  if (!keys.length && !meta.notes) {
    metricsPanel.classList.remove("show");
    return;
  }
  metricsRows.innerHTML = "";
  keys.forEach(k => {
    const { label, value, hint } = metricParts(k, m[k]);
    const row = document.createElement("div");
    row.className = "m-row";
    row.innerHTML = `<span class="k"></span><span class="v"></span>`;
    row.querySelector(".k").textContent = label;
    const v = row.querySelector(".v");
    v.textContent = (value === undefined || value === null)
      ? "" : formatMetric(value);
    if (hint) {
      const h = document.createElement("span");
      h.className = "m-hint";
      h.textContent = hint;
      v.appendChild(h);
    }
    metricsRows.appendChild(row);
  });
  // notes carries the skill's explanation and suggestion; keep it verbatim
  // so the wording the skill chose is what the user reads.
  metricsNotes.textContent = meta.notes || "";
  metricsNotes.style.display = meta.notes ? "" : "none";
  metricsPanel.classList.add("show");
}

const stylePicker = document.getElementById("style-picker");
const colorPicker = document.getElementById("color-picker");
const ligandStylePicker = document.getElementById("ligand-style-picker");
const resetBtn = document.getElementById("reset-btn");

// `snap` is a per-tab snapshot from captureState(), or null for a
// structure arriving fresh from a publish.
function renderStructure(data, meta, snap) {
  state.meta = meta;

  // Restore this tab's selection before anything reads it.
  //
  // state.selection and state.hiddenChains still hold the previous tab's
  // contents on entry. applyStyle() below paints from them, so restoring
  // afterwards left the old tab's highlights drawn on the new structure
  // while the panel showed the new tab's state — a residue appearing
  // selected in two tabs at once, and the tab it belonged to showing
  // nothing.
  restoreState(snap);

  const fmt = meta.format === "pdb" ? "pdb" : "mmcif";

  // Clear, then build, then render — all before yielding to the browser.
  //
  // The flicker came from removeAllModels() emptying the scene while
  // render() was not reached until the styles were set several statements
  // later; the browser painted one blank frame in between. Everything from
  // here to viewer.render() is synchronous, so no frame is produced until
  // the new model is fully styled.
  //
  // removeModel(id) is not an alternative: viewer.models is a sparse array
  // keyed by ID, and deleting a middle entry leaves its length unchanged,
  // so the model count climbs on every poll even though only one is drawn.
  viewer.removeAllModels();
  viewer.addModel(data, fmt);

  // removeAllModels() clears click bindings — re-attach for the new model
  viewer.setClickable({}, true, onAtomClick);
  // 3Dmol waits 500 ms before firing a hover, which feels laggy for a
  // tooltip that is only naming the residue under the cursor.
  viewer.setHoverDuration(0);
  viewer.setHoverable({}, true, onAtomHover, onHoverOut);

  state.chains = extractChains(viewer.getModel());
  const isPeptide = state.chains.length > 0;
  if (isPeptide) {
    applyStyle();
  } else {
    // Non-protein (ligands, nucleic acids): plain sticks
    viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: "Jmol" } });
  }
  viewer.zoomTo();
  viewer.render();

  hint.classList.add("hidden");
  label.innerHTML = "";
  label.appendChild(document.createTextNode(meta.name || "structure"));
  if (meta.source) {
    const src = document.createElement("span");
    src.className = "src";
    src.textContent = `  ·  ${meta.source}`;
    label.appendChild(src);
  }
  label.classList.add("show");

  // The view is always the whole complex; per-chain control lives in the
  // sequence panel's eye toggles.
  const metaChains = meta.chains || [];
  const ligandChains = metaChains.filter(c => c.ligand);
  if (state.chains.length === 0 && ligandChains.length === 0) {
    seqPanel.classList.remove("show");
  } else {
    renderSequence(null);
  }

  renderMetrics(meta);

  // Enable the style controls. The state.selection state was restored at the top
  // of this function, before applyStyle() painted from it.
  stylePicker.disabled = false;
  colorPicker.disabled = false;
  ligandStylePicker.disabled = ligandChains.length === 0;
  resetBtn.disabled = false;
  viewer.removeAllLabels();
  // A publish's highlight applies once, when the structure arrives. On a
  // tab switch it would re-add residues the user has since dismissed, so
  // it is skipped when restoring a saved snapshot.
  if (!snap) applyHighlights(meta);
  renderSelectionPanel();
}

// A skill can ask for residues to be highlighted on publish, so the user
// sees what was just changed without hunting for it. current.json carries
//
//   "highlight": [{"chain": "A", "resi": 385}, ...]
//
// and those residues are selected exactly as if the user had clicked them
// — same colours, same panel rows, same state.selection.json. The user can then
// dismiss them individually or clear the lot.
//
// Residues that are not in the loaded model are skipped rather than
// erroring: a skill may name a residue the published structure does not
// contain (a chain it dropped, a numbering that shifted).
function applyHighlights(meta) {
  const wanted = meta.highlight;
  if (!Array.isArray(wanted) || !wanted.length) return;

  const model = viewer.getModel();
  if (!model) return;
  const atoms = model.atoms || [];
  const byKey = {};
  atoms.forEach(a => { byKey[selKey(a)] = a; });

  wanted.forEach(w => {
    if (!w || !w.chain || w.resi === undefined) return;
    const key = `${w.chain}:${w.resi}`;
    const atom = byKey[key];
    if (!atom) return;
    if (state.selection[key]) return;
    state.selection[key] = {
      sel: { chain: atom.chain, resi: atom.resi },
      label: selLabel(atom),
      color: nextColor(atom.chain),
    };
  });
  applyStyle();
}

/* ---------------- style controls ---------------- */

// A blue-white palette, keyed by chain ID. Chains beyond the list fall
// back to the last entry, so a structure with more chains than colours
// A blue-to-white ramp, keyed by chain ID. Chains beyond the list fall back
// to the last entry, so a structure with more chains than colours still
// renders. Chosen over a 3Dmol gradient because CustomLinear does not apply
// to cartoon rendering in this build.
//
// The ramp starts light and ends white. A ramp that begins at a saturated
// navy looks uniformly dark on a two- or three-chain complex, since those
// only ever use the first few entries — the pale end has to be reachable
// from the start, not reserved for the eighth chain.
const BLUE_WHITE = ["#7dd3fc", "#bae6fd", "#e0f2fe", "#f0f9ff",
                    "#ffffff", "#ffffff", "#ffffff", "#ffffff"];

// `chains` is the array from extractChains: [{chain, seq, residues}]. The
// key is the chain ID string, not the object — using the object made every
// entry "[object Object]" and the whole structure rendered in one colour.
function chainColorMap(chains) {
  const map = {};
  (chains || []).forEach((c, i) => {
    const id = typeof c === "string" ? c : c.chain;
    if (id == null) return;
    map[id] = BLUE_WHITE[Math.min(i, BLUE_WHITE.length - 1)];
  });
  return map;
}

// Secondary structure follows the same ramp: helices deepest, sheets mid,
// coils the palest — so the fold is legible without leaving the palette.
const SS_BLUE_WHITE = { h: "#38bdf8", s: "#bae6fd", c: "#f0f9ff" };

// Element colours for the per-atom styles (stick, sphere, line). A
// chain-coloured stick render makes every atom the same colour, which
// hides the chemistry; these keep O, N and S readable while staying in a
// cool palette. Jmol's own element colours are the reference here.
const ELEMENT_COLORS = {
  C: "#9ca3af", N: "#2563eb", O: "#ef4444", S: "#eab308",
  H: "#f8fafc", P: "#0ea5e9", SE: "#f59e0b", FE: "#f97316",
};

// Same hues, lifted in brightness, for a selected ligand. Flattening to a
// single highlight colour destroys the O/N/C readout, and merely making
// the sticks thicker looks clumsy — a brighter version of the same palette
// says "selected" while keeping the chemistry legible.
const ELEMENT_COLORS_HI = {
  C: "#e5e7eb", N: "#60a5fa", O: "#fb7185", S: "#fde047",
  H: "#ffffff", P: "#38bdf8", SE: "#fbbf24", FE: "#fb923c",
};

// Blend a hex colour toward another by t (0 = base, 1 = target).
function mixHex(base, target, t) {
  const b = parseInt(base.slice(1), 16);
  const g = parseInt(target.slice(1), 16);
  const r = Math.round(((b >> 16) & 255) * (1 - t) + ((g >> 16) & 255) * t);
  const gr = Math.round(((b >> 8) & 255) * (1 - t) + ((g >> 8) & 255) * t);
  const bl = Math.round((b & 255) * (1 - t) + (g & 255) * t);
  return "#" + ((1 << 24) | (r << 16) | (gr << 8) | bl).toString(16).slice(1);
}

// Element colours tinted toward the user's state.selection colour. The molecule
// keeps its O/N/C identity but visibly carries the state.selection colour, which
// is what the swatch in the Selection panel promises.
function elementColorsTinted(selColor, t = 0.55) {
  const out = {};
  for (const [el, hex] of Object.entries(ELEMENT_COLORS)) {
    out[el] = mixHex(hex, selColor, t);
  }
  return out;
}

// 3Dmol distinguishes two style fields: `color` takes a literal colour
// ("red", "#ff0000") while `colorscheme` takes the name of a built-in
// scheme. Passing a scheme name to `color` logs "color not found" for
// every atom and falls back to the default.
//
// "spectrum" is the exception — it is a gradient, not an entry in the
// scheme table, and only works through `color`. Verified by pixel count:
// color:"spectrum" gives 63% coloured pixels, colorscheme:"spectrum" 13%.
//
// `perAtom` selects element colours instead of the chain/secondary
// scheme, for styles that draw individual atoms.
function colorSpec(scheme, chains, perAtom = false) {
  if (perAtom) {
    return { colorscheme: { prop: "elem", map: ELEMENT_COLORS } };
  }
  switch (scheme) {
    case "chain":
      return { colorscheme: { prop: "chain", map: chainColorMap(chains) } };
    case "secondary":
      return { colorscheme: { prop: "ss", map: SS_BLUE_WHITE } };
    default:          return { color: "spectrum" };
  }
}

function styleSpec(kind, scheme, chains) {
  // stick/sphere/line draw atoms, so they get element colours; cartoon and
  // surface draw the fold, so they keep the chain/secondary scheme.
  const perAtom = (kind === "stick" || kind === "sphere" || kind === "line");
  const color = colorSpec(scheme, chains, perAtom);
  // 3Dmol's default lighting is a single hard key light, which carves deep
  // shadows out of a surface and buries anything inside a pocket. A strong
  // ambient term lifts the shadow side to a mid tone rather than black, and
  // the emission keeps the pale end of the ramp reading as white instead of
  // grey.
  const soft = { ...color, ambientColor: "#c8d6e8", emissiveColor: "#5b6b80" };
  switch (kind) {
    case "stick":   return { stick: { ...color, radius: 0.18 } };
    case "sphere":  return { sphere: { ...color, scale: 0.5 } };
    case "line":    return { line: { ...color, linewidth: 2 } };
    case "surface": return { cartoon: soft, surface: { opacity: 0.15, color: "white", ambientColor: "#7f8ea3" } };
    default:        return { cartoon: soft, stick: {} };
  }
}

// How a small molecule is drawn. Jmol element colours throughout — blue
// N, red O, grey C — the convention chemists read at a glance, and it
// keeps the ligand distinguishable from a protein coloured by chain.
//
// `thick` is set when the protein is drawn as a surface: that shell is
// depth-sorted and opaque, so anything inside the pocket needs extra
// visual weight to read through it.
function ligandStyleSpec(kind, thick) {
  switch (kind) {
    case "stick":
      return { stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" } };
    case "spacefill":
      return { sphere: { scale: thick ? 0.55 : 0.45, colorscheme: "Jmol" } };
    case "line":
      return { line: { linewidth: thick ? 4 : 3, colorscheme: "Jmol" } };
    case "ballstick":
    default:
      return {
        stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" },
        sphere: { scale: thick ? 0.42 : 0.32, colorscheme: "Jmol" }
      };
  }
}

// How a selected residue is marked. It has to match the style the protein
// is drawn in, otherwise the highlight replaces that residue's rendering
// and looks detached — sticks over a surface float outside the shell.
//
// Every case also draws the side chain as sticks. A residue selected in a
// surface or cartoon view is otherwise just a patch of colour, which says
// "here" but not "what is here" — and the side chain is what a mutation
// actually changes. The backbone representation is kept underneath, so the
// residue stays in context rather than being replaced by loose sticks.
function selectionHighlightSpec(kind) {
  const sidechain = { stick: { radius: 0.22, colorscheme: "Jmol" } };
  switch (kind) {
    case "surface":
      return { cartoon: {}, surface: { opacity: 0.85 }, ...sidechain };
    case "stick":
      return { stick: { radius: 0.3 }, ...sidechain };
    case "sphere":
      return { sphere: { scale: 0.6 }, ...sidechain };
    case "line":
      return { line: { linewidth: 5 }, ...sidechain };
    default:
      return { cartoon: {}, stick: { radius: 0.25 }, ...sidechain };
  }
}

function applyStyle() {
  const kind = stylePicker.value;
  const scheme = colorPicker.value;

  viewer.setStyle({}, {});

  // Every chain keeps the chosen style; picking one only moves the camera
  // onto it, so the rest of the complex stays on screen for context.
  viewer.setStyle({}, styleSpec(kind, scheme, state.chains.map(c => c.chain)));

  // Ligands (non-amino-acid chains from metadata) get their own rendering
  // style, chosen independently of the protein's, so a small molecule
  // stays legible inside a structure of thousands of atoms.
  // current.json chains carry "id", not "chain" — see publish.py.
  const ligandChains = (state.meta.chains || [])
    .filter(c => c.ligand)
    .map(c => c.id);
  if (ligandChains.length) {
    const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
    ligandChains.forEach(ch => viewer.setStyle({ chain: ch }, spec));
  }

// Alpha-sphere clouds from fpocket are a point set, not a molecule: the
// atoms have no bonds between them, so a stick render draws nothing but
// isolated dots and a ball-and-stick adds stray spheres. Spheres alone
// read as the cavity's shape, which is what they are.
//
// White rather than a hue: the cloud sits on top of a protein already
// coloured by chain, and a saturated default competes with it. White reads
// as "cavity" without taking a side, and leaves the selection colours
// free to mean "chosen".
//
// Opacity has to clear two bars at once: high enough that the cloud
// reads as a volume against the surface shell, low enough that the
// lining residues stay visible through it. 0.55 washed out to nothing.
const POCKET_SPHERE = { scale: 0.35, color: "#ffffff", opacity: 0.85 };

viewer.setStyle({ resn: "STP" }, { sphere: { ...POCKET_SPHERE } });

  // Hidden chains get an empty style, which removes them from the render
  // without touching the model — so toggling the eye is reversible.
  // This has to come last: the ligand block above would otherwise re-style
  // a hidden ligand and undo the hide.
  state.hiddenChains.forEach(ch => viewer.setStyle({ chain: ch }, {}));

  // A selected ligand keeps exactly the geometry it already had; only the
  // element colours change, each tinted toward the user's state.selection colour.
  // Overwriting with one flat tone would destroy the O/N/C readout, and
  // changing the radius makes the molecule look fatter than its neighbours.
  const highlight = selectionHighlightSpec(kind);
  const ligandIds = new Set((state.meta.chains || [])
    .filter(c => c.ligand).map(c => c.id));
  Object.entries(state.selection).forEach(([key, item]) => {
    // A selected pocket takes the state.selection colour and grows slightly.
    // Opacity stays put: changing it reorders 3Dmol's transparent pass and
    // the other pockets fade with it, which reads as "selecting one dims
    // them all". A slightly larger sphere in the selection colour marks
    // the chosen one without touching the render queue.
    if (item.pocket) {
      viewer.setStyle(item.sel, {
        sphere: { scale: 0.45, color: item.color, opacity: 0.85 },
      });
      return;
    }
    // A single atom or a bond: keep the geometry exactly as it was and
    // only shift the element colours toward the state.selection colour. Scaling
    // the sphere up made the atom look like a different, larger atom
    // rather than the same one marked; tinting says "selected" while the
    // O/N/C readout and the size stay honest.
    if (item.atom || item.bond) {
      const map = elementColorsTinted(item.color);
      viewer.setStyle(item.sel, {
        stick: { radius: item.bond ? 0.3 : 0.22,
                 colorscheme: { prop: "elem", map } },
        sphere: { scale: item.bond ? 0.42 : 0.32,
                  colorscheme: { prop: "elem", map } },
      });
      return;
    }
    if (ligandIds.has(item.sel.chain)) {
      const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
      const map = elementColorsTinted(item.color);
      const styled = {};
      for (const [k, v] of Object.entries(spec)) {
        styled[k] = { ...v, colorscheme: { prop: "elem", map } };
      }
      viewer.setStyle(item.sel, styled);
      return;
    }
    const styled = {};
    for (const [k, v] of Object.entries(highlight)) {
      // The side chain keeps Jmol element colours — blue N, red O, grey C
      // — so the residue's chemistry stays legible. Only the backbone
      // representation carries the state.selection colour, which is what marks
      // the residue as chosen.
      styled[k] = k === "stick" && v.colorscheme
        ? { ...v }
        : { ...v, color: item.color };
    }
    viewer.setStyle(item.sel, styled);
  });

  viewer.render();
}

stylePicker.addEventListener("change", applyStyle);
colorPicker.addEventListener("change", applyStyle);
ligandStylePicker.addEventListener("change", applyStyle);

resetBtn.addEventListener("click", () => {
  viewer.zoomTo();
  viewer.render();
});


/* ---------------- residue selection ---------------- */

const selectionPanel = document.getElementById("selection");
const selList = document.getElementById("sel-list");
const selClear = document.getElementById("sel-clear");

// What a click selects: "res" — the single residue under the cursor;
// "chain" — that residue's whole chain; "atom" — one atom; "bond" — a
// bond to a neighbour. Lives in state so a tab can keep its own mode.
const PALETTE = ["#ff6b6b", "#4ecdc4", "#ffe66d", "#a78bfa",
                 "#fb923c", "#34d399", "#f472b6", "#60a5fa"];

function selKey(atom) {
  return `${atom.chain || "_"}:${atom.resi}`;
}

// Atom-level key. `index` is 3Dmol's global atom index, unique across the
// whole model, so it identifies one atom unambiguously — unlike
// chain:resi:name, which repeats for altlocs and for the same residue name
// in different models.
function atomKey(atom) {
  return `atom:${atom.index}`;
}

// Bond key from two atom indices, ordered so the same bond clicked from
// either end yields the same key.
function bondKey(a, b) {
  return `bond:${Math.min(a, b)}-${Math.max(a, b)}`;
}

function atomLabel(atom) {
  const where = `${atom.resn || "?"} ${atom.resi}${atom.chain ? " · " + atom.chain : ""}`;
  return `${atom.atom || atom.elem || "?"} — ${where}`;
}

function bondLabel(a, b) {
  // Ligand atoms often share a residue number, so "C1–O1" is ambiguous
  // when both ends are carbon. Include the element and, when the two ends
  // would otherwise read the same, the atom index.
  const name = x => `${x.atom || x.elem}${x.resi}`;
  const same = name(a) === name(b);
  const tag = x => same ? `${name(x)}#${x.index}` : name(x);
  return `${tag(a)}–${tag(b)}`;
}

// Persist the current state.selection so an agent can read it.
// Written to static/state.selection.json — see the structure-viewer skill.
// Chain-level selections are written as {"chain": "B", "whole_chain": true}
// so a skill can act on them without expanding hundreds of residues.
function persistSelection(keys) {
  const residues = [];
  const chainSelections = [];
  const atoms = [];
  const bonds = [];
  const pockets = [];
  keys.forEach(k => {
    const item = state.selection[k];
    if (item.pocket) {
      pockets.push({
        chain: item.sel.chain,
        color: item.color,
      });
      return;
    }
    if (item.chain) {
      chainSelections.push({
        chain: item.sel.chain,
        whole_chain: true,
        color: item.color,
      });
      return;
    }
    if (item.atom) {
      atoms.push({
        index: item.sel.index,
        label: item.label,
        color: item.color,
      });
      return;
    }
    if (item.bond) {
      bonds.push({
        indices: item.sel.index,
        label: item.label,
        color: item.color,
      });
      return;
    }
    const [chain, resi] = k.split(":");
    residues.push({
      chain,
      resi: isNaN(Number(resi)) ? resi : Number(resi),
      resn: item.label.split(" ")[0],
      color: item.color,
    });
  });

  const payload = {
    structure: state.structureName || null,
    count: residues.length + chainSelections.length
         + atoms.length + bonds.length + pockets.length,
    residues,
    updated: new Date().toISOString(),
  };
  if (pockets.length) payload.pockets = pockets;
  if (chainSelections.length) payload.chains = chainSelections;
  if (atoms.length) payload.atoms = atoms;
  if (bonds.length) payload.bonds = bonds;

  // Fire-and-forget: the viewer must not block on this write.
  fetch("selection.json", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  }).catch(() => { /* static server may reject POST; selection still works */ });
}

function selLabel(atom) {
  return `${atom.resn || "?"} ${atom.resi}${atom.chain ? " · " + atom.chain : ""}`;
}

/* ---------------- hover tooltip ---------------- */

const hoverTip = document.getElementById("hover-tip");

// 3Dmol gives us the atom under the cursor but not the pointer position,
// so track that ourselves and place the tip next to it.
let hoverPos = { x: 0, y: 0 };

function onAtomHover(atom) {
  if (!atom) {
    hoverTip.hidden = true;
    return;
  }
  const resn = atom.resn || "?";
  const resi = atom.resi != null ? atom.resi : "";
  const chain = atom.chain || "_";
  const elem = atom.elem ? ` ${atom.elem}` : "";

  hoverTip.innerHTML = "";
  const res = document.createElement("span");
  res.className = "ht-res";
  res.textContent = `${resn} ${resi}${elem}`;
  hoverTip.appendChild(res);

  const ch = document.createElement("span");
  ch.className = "ht-chain";
  ch.textContent = `chain ${chain}`;
  hoverTip.appendChild(ch);

  // Say whether this residue is already selected, so the user knows what
  // a click will do before making it.
  const key = `${chain}:${resi}`;
  if (state.selection[key] || state.selection[`chain:${chain}`]) {
    const sel = document.createElement("span");
    sel.className = "ht-sel";
    sel.textContent = "selected";
    hoverTip.appendChild(sel);
  }

  // In atom/bond mode the atom name is the thing being picked, so lead
  // with it rather than burying it after the residue.
  if (state.selMode === "atom" || state.selMode === "bond") {
    const name = document.createElement("span");
    name.className = "ht-chain";
    name.textContent = atom.atom || atom.elem || "";
    hoverTip.appendChild(name);
    const akey = atomKey(atom);
    if (state.selection[akey]) {
      const sel = document.createElement("span");
      sel.className = "ht-sel";
      sel.textContent = "selected";
      hoverTip.appendChild(sel);
    }
  }

  hoverTip.hidden = false;
  positionTip();
}

function onHoverOut() {
  hoverTip.hidden = true;
}

// Keep the tip inside the viewer: flip it to the other side of the cursor
// when it would run off the right or bottom edge.
function positionTip() {
  const wrap = document.getElementById("viewer-wrap").getBoundingClientRect();
  const w = hoverTip.offsetWidth;
  const h = hoverTip.offsetHeight;
  let x = hoverPos.x + 14;
  let y = hoverPos.y + 14;
  if (x + w > wrap.width - 8) x = hoverPos.x - w - 14;
  if (y + h > wrap.height - 8) y = hoverPos.y - h - 14;
  hoverTip.style.left = `${Math.max(8, x)}px`;
  hoverTip.style.top = `${Math.max(8, y)}px`;
}

document.getElementById("viewer-wrap").addEventListener("mousemove", (e) => {
  const wrap = e.currentTarget.getBoundingClientRect();
  hoverPos = { x: e.clientX - wrap.left, y: e.clientY - wrap.top };
  if (!hoverTip.hidden) positionTip();
});

document.getElementById("viewer-wrap").addEventListener("mouseleave", () => {
  hoverTip.hidden = true;
});

function renderSelectionPanel() {
  const keys = Object.keys(state.selection);
  selList.innerHTML = "";
  selectionPanel.classList.add("show");

  persistSelection(keys);

  if (!keys.length) {
    const hint = {
      res: "Click residues in the viewer to select them. Click again to " +
           "deselect. Switch to <b>Chain</b> to select a whole chain at once.",
      chain: "Click any atom to select its whole chain.",
      atom: "Click an atom to select just that atom.",
      bond: "Click an atom to select the bond to a neighbour. Click again " +
            "to walk to the next bond around that atom.",
    }[state.selMode] || "";
    selList.innerHTML = `<div class="s-empty">${hint}</div>`;
    return;
  }

  keys.forEach(key => {
    const item = state.selection[key];
    const row = document.createElement("div");
    row.className = "s-row";

    const sw = document.createElement("span");
    sw.className = "s-swatch";
    sw.style.background = item.color;

    const name = document.createElement("span");
    name.className = "s-name";
    name.textContent = item.label;

    const del = document.createElement("button");
    del.className = "s-del";
    del.textContent = "×";
    del.title = "Remove";
    del.addEventListener("click", ev => {
      ev.stopPropagation();
      delete state.selection[key];
      applyStyle();
      renderSelectionPanel();
    });

    // Clicking the row flies the camera to that state.selection. The panel lists
    // things picked from all over the complex, and without this the only
    // way back to one is to hunt for it in the 3D view.
    row.addEventListener("click", () => seekToSelection(item.sel));

    row.append(sw, name, del);
    selList.appendChild(row);
  });
}

// Centre the camera on a state.selection spec. zoomTo takes a 3Dmol state.selection,
// not coordinates — it resolves the atoms itself and frames them, so a
// single atom and a whole chain both work through the same call.
//
// A lone atom has no extent, and zoomTo's own minimum framing is 5 units,
// which would leave it lost in the middle of the screen. Widen the
// state.selection to the atom's residue in that case so the framing has
// something to work with.
function seekToSelection(sel) {
  if (!sel) return;
  const model = viewer.getModel();
  if (!model) return;

  let target = sel;
  if (sel.index !== undefined) {
    const atoms = Array.isArray(sel.index) ? sel.index : [sel.index];
    const found = atoms.map(i => model.atoms.find(a => a.index === i))
                        .filter(Boolean);
    if (!found.length) return;
    if (found.length === 1) {
      // one atom: frame its residue instead, so the view has context
      target = { chain: found[0].chain, resi: found[0].resi };
    } else {
      target = { index: atoms };
    }
  }

  viewer.zoomTo(target, 600);
  viewer.render();
}

// Colour for the next state.selection. Derived from how many things are already
// selected rather than from a running counter, so the sequence is stable:
// selecting the same residues in the same order always yields the same
// colours, and cancelling one in the middle does not shift the rest.
//
// Residues on the same chain share a colour, which keeps a multi-residue
// state.selection on one chain visually coherent.
function nextColor(chainId) {
  const used = new Set(Object.values(state.selection).map(s => s.color));
  const sameChain = Object.values(state.selection).find(
    s => s.sel && s.sel.chain === chainId);
  if (sameChain) return sameChain.color;
  const free = PALETTE.find(c => !used.has(c));
  return free || PALETTE[Object.keys(state.selection).length % PALETTE.length];
}

function addSelection(atom) {
  const key = selKey(atom);
  if (state.selection[key]) return;
  // An alpha-sphere cloud is one pocket, not one residue: every sphere in
  // it shares residue number 1, so selecting by residue would collapse
  // 74 spheres into a single entry and fade only one of them. Select the
  // whole chain instead, and mark it so the styling knows to fade rather
  // than recolour.
  if (atom.resn === "STP") {
    const chainKey = `chain:${atom.chain}`;
    if (state.selection[chainKey]) return;
    state.selection[chainKey] = {
      sel: { chain: atom.chain, resn: "STP" },
      label: `Pocket ${atom.chain}`,
      color: nextColor(atom.chain),
      chain: true,
      pocket: true,
    };
    return;
  }
  state.selection[key] = {
    sel: { chain: atom.chain, resi: atom.resi },
    label: selLabel(atom),
    color: nextColor(atom.chain),
  };
}

function addChainSelection(chainId) {
  const key = `chain:${chainId}`;
  if (state.selection[key]) return;
  const info = state.chains.find(c => c.chain === chainId);
  state.selection[key] = {
    sel: { chain: chainId },
    label: `Chain ${chainId}${info ? ` (${info.seq.length} aa)` : ""}`,
    color: nextColor(chainId),
    chain: true,
  };
}

// A single atom. The style spec matches on 3Dmol's index, which is the
// only per-atom selector setStyle accepts.
function addAtomSelection(atom) {
  const key = atomKey(atom);
  if (state.selection[key]) return;
  state.selection[key] = {
    sel: { index: atom.index },
    label: atomLabel(atom),
    color: nextColor(atom.chain),
    atom: true,
  };
}

// A bond between the clicked atom and one of its neighbours. 3Dmol reports
// no bond on click, so the neighbour is picked from the atom's `bonds`
// list — the first one that is not already selected, so repeated clicks
// walk around the atom rather than re-picking the same bond.
function addBondSelection(atom) {
  const model = viewer.getModel();
  const byIndex = {};
  (model.atoms || []).forEach(a => { byIndex[a.index] = a; });
  const neighbours = (atom.bonds || []).map(i => byIndex[i]).filter(Boolean);
  if (!neighbours.length) return;

  const taken = new Set(
    Object.keys(state.selection)
      .filter(k => k.startsWith("bond:"))
      .map(k => k.slice(6).split("-").map(Number))
      .flat()
  );
  const other = neighbours.find(n => !taken.has(n.index)) || neighbours[0];

  const key = bondKey(atom.index, other.index);
  if (state.selection[key]) {
    delete state.selection[key];
    return;
  }
  state.selection[key] = {
    sel: { index: [atom.index, other.index] },
    label: bondLabel(atom, other),
    color: nextColor(atom.chain),
    bond: true,
  };
}

// 3Dmol click handling: nearest atom within a pixel radius.
// What a click selects depends on the Res/Chain toggle in the Selection
// panel: in "res" mode it toggles the single residue, in "chain" mode it
// toggles that residue's whole chain. Clicking an already-selected target
// deselects it. Alt/Option + click always removes.
function onAtomClick(atom) {
  if (!atom) return;
  const alt = window.event && window.event.altKey;

  if (state.selMode === "chain") {
    const key = `chain:${atom.chain}`;
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addChainSelection(atom.chain);
    }
  } else if (state.selMode === "atom") {
    const key = atomKey(atom);
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addAtomSelection(atom);
    }
  } else if (state.selMode === "bond") {
    if (alt) {
      // Alt-click removes whichever selected bond touches this atom.
      const touched = Object.keys(state.selection).filter(k => {
        if (!k.startsWith("bond:")) return false;
        const [a, b] = k.slice(6).split("-").map(Number);
        return a === atom.index || b === atom.index;
      });
      touched.forEach(k => delete state.selection[k]);
    } else {
      addBondSelection(atom);
    }
  } else {
    // An alpha-sphere cloud is keyed by chain, not residue: every sphere
    // in a pocket shares residue number 1, so the residue key would never
    // match the entry addSelection stored and a second click would not
    // toggle it off.
    if (atom.resn === "STP") {
      const key = `chain:${atom.chain}`;
      if (alt || state.selection[key]) {
        delete state.selection[key];
      } else {
        addSelection(atom);
      }
      applyStyle();
      renderSelectionPanel();
      return;
    }
    const key = selKey(atom);
    if (alt || state.selection[key]) {
      delete state.selection[key];
    } else {
      addSelection(atom);
    }
  }
  applyStyle();
  renderSelectionPanel();
}

// Res/Chain toggle
document.querySelectorAll("#sel-mode .s-mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    state.selMode = btn.dataset.mode;
    document.querySelectorAll("#sel-mode .s-mode-btn")
      .forEach(b => b.classList.toggle("on", b === btn));
  });
});

selClear.addEventListener("click", () => {
  state.selection = {};
  applyStyle();
  renderSelectionPanel();
});

/* ---------------- status bar ---------------- */

function renderStatus(s) {
  if (!s || s.state === "idle") {
    statusBar.classList.remove("show");
    return;
  }
  statusBar.dataset.state = s.state;
  statusBar.querySelector(".msg").textContent = s.message || s.state;

  const total = s.step_total || 0;
  const idx = s.step_index || 0;
  const pct = total > 0 ? Math.round((idx / total) * 100) : 0;
  statusBar.querySelector(".bar > div").style.width = pct + "%";
  statusBar.querySelector(".step").textContent =
    total > 0 ? `${idx}/${total} ${s.step || ""}`.trim() : "";

  statusBar.classList.add("show");
}

/* ---------------- structure tabs ---------------- */

const tabsBar = document.getElementById("tabs");
const MAX_TABS = 12;

// A republish of the same name replaces that tab rather than adding a
// second one — rerunning a skill should not pile up duplicates.
// `activate` decides whether the new tab also takes over the screen. A
// publish while the user is on an older tab records the structure but
// leaves the view where it is; the caller then keeps activeTab as it was.
function addTab(text, meta, activate = true) {
  const name = meta.name || "structure";
  const existing = state.tabs.findIndex(t => t.meta.name === name);
  if (existing >= 0) {
    // Keep whatever the user had selected on this tab; only the
    // structure and its metadata are new.
    const kept = state.tabs[existing].state;
    state.tabs[existing] = { text, meta, state: kept };
    if (activate) state.activeTab = existing;
  } else {
    state.tabs.push({ text, meta, state: null });
    if (activate) {
      state.activeTab = state.tabs.length - 1;
      if (state.tabs.length > MAX_TABS) {
        state.tabs.shift();
        state.activeTab -= 1;
      }
    } else if (state.tabs.length > MAX_TABS) {
      state.tabs.shift();
      if (state.activeTab > 0) state.activeTab -= 1;
    }
  }
  renderTabs();
}

function renderTabs() {
  tabsBar.innerHTML = "";
  if (state.tabs.length < 2) {
    // A single structure needs no tab bar; the label already names it.
    tabsBar.classList.remove("show");
    return;
  }
  tabsBar.classList.add("show");
  state.tabs.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tab" + (i === state.activeTab ? " on" : "");

    const name = document.createElement("span");
    name.className = "t-name";
    name.textContent = t.meta.name || "structure";
    el.appendChild(name);

    if (t.meta.source) {
      const src = document.createElement("span");
      src.className = "t-src";
      src.textContent = t.meta.source;
      el.appendChild(src);
    }

    const close = document.createElement("button");
    close.className = "t-close";
    close.textContent = "×";
    close.title = "Close";
    close.addEventListener("click", ev => {
      ev.stopPropagation();
      closeTab(i);
    });    el.appendChild(close);

    el.addEventListener("click", ev => {
      // The bar floats over the viewer canvas, and 3Dmol listens for
      // clicks above its own element. Without stopping propagation the
      // same click also lands as an atom click, which rewrites the
      // state.selection before switchTab can save it — the tab then restores
      // whatever the stray click happened to hit.
      ev.stopPropagation();
      ev.preventDefault();
      switchTab(i);
    });
    tabsBar.appendChild(el);
  });
}

function closeTab(i) {
  if (state.tabs.length <= 1) return;
  state.tabs.splice(i, 1);
  if (state.activeTab >= state.tabs.length) state.activeTab = state.tabs.length - 1;
  else if (i < state.activeTab) state.activeTab -= 1;
  // switchTab would bail on i === state.activeTab, and the surviving tab has
  // to be drawn regardless — render it directly.
  const t = state.tabs[state.activeTab];
  state.structureName = t.meta.name || null;
  renderStructure(t.text, t.meta, t.state);
  renderTabs();
}

function switchTab(i) {
  if (i < 0 || i >= state.tabs.length || i === state.activeTab) return;
  // Save the outgoing tab's state before the incoming one overwrites the
  // singletons.
  if (state.activeTab >= 0 && state.tabs[state.activeTab]) {
    state.tabs[state.activeTab].state = captureState();
  }
  state.activeTab = i;
  const t = state.tabs[i];
  state.structureName = t.meta.name || null;
  renderStructure(t.text, t.meta, t.state);
  renderTabs();
}

/* ---------------- polling ---------------- */

async function poll() {
  try {
    const res = await fetch("current.json?t=" + Date.now());
    if (res.ok) {
      const meta = await res.json();
      // Compare against the contract's own last-seen timestamp, not the
      // active tab's. A tab switched to an older structure has an older
      // timestamp, and using it here would make every poll think the
      // contract had changed.
      if (meta.updated && meta.updated !== state.contractUpdated) {
        const cif = await fetch("current.cif?t=" + Date.now());
        if (!cif.ok) return;
        const text = await cif.text();

        // A new publish is always recorded as a tab. Whether it also takes
        // over the screen depends on what the user is looking at:
        //
        //  - on the newest tab: switch to it, as before.
        //  - on an older tab: leave the view alone. The contract file holds
        //    only the latest structure, so following it here would yank the
        //    user off the tab they opened deliberately. The new tab is
        //    added and marked, and they can click it when ready.
        const onNewest = state.activeTab === state.tabs.length - 1;
        if (state.activeTab >= 0 && state.tabs[state.activeTab]) {
          state.tabs[state.activeTab].state = captureState();
        }
        addTab(text, meta, onNewest);
        if (onNewest) {
          state.lastUpdated = meta.updated;
          state.structureName = meta.name || null;
          renderStructure(text, meta, null);
        }
        state.contractUpdated = meta.updated;
        renderTabs();
      }
    }
  } catch (e) { /* viewer not published yet */ }

  try {
    const res = await fetch("status.json?t=" + Date.now());
    if (res.ok) renderStatus(await res.json());
  } catch (e) { /* no status file */ }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
