<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioBench Viewer</title>
<script src="3Dmol-min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --border: #223040;
    --text: #dbe6f0;
    --muted: #7d8fa3;
    --accent: #4da3ff;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ---------- viewer ---------- */
  #viewer-wrap {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #16202b 0%, #0b0f14 70%);
  }
  #viewer { width: 100%; height: 100%; }
  /* Follows the cursor over the canvas and names the residue under it. */
  #hover-tip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    background: rgba(13,18,25,.92);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--text);
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    backdrop-filter: blur(4px);
  }
  #hover-tip .ht-res { font-weight: 600; }
  #hover-tip .ht-chain { color: var(--muted); margin-left: 6px; }
  #hover-tip .ht-sel { color: var(--accent); margin-left: 6px; }
  #viewer-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    pointer-events: none;
    text-align: center;
    padding: 20px;
  }
  #viewer-hint.hidden { display: none; }
  #viewer-hint .big { font-size: 18px; color: var(--text); }
  #viewer-hint .small { font-size: 13px; max-width: 460px; line-height: 1.7; }
  #viewer-hint code {
    background: rgba(10,14,19,.8);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--accent);
  }

  /* ---------- top bar ---------- */
  #topbar {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctl {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(19,26,34,.72);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 30px 7px 14px;
    cursor: pointer;
    outline: none;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237d8fa3'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 8px center;
    background-size: 15px;
    transition: border-color .15s;
  }
  .ctl:hover { border-color: rgba(77,163,255,.5); }
  .ctl:disabled { opacity: .45; cursor: default; }
  .ctl option { background: #131a22; color: var(--text); }
  .ctl.icon {
    padding: 7px;
    width: 32px; height: 32px;
    background-image: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ctl.icon svg { width: 15px; height: 15px; fill: var(--muted); }
  .ctl.icon:hover svg { fill: var(--text); }

  /* ---------- structure label ---------- */
  #structure-label {
    position: absolute;
    top: 14px; left: 16px;
    /* Above #left-col (z-index 10) so the switcher menu can open over the
       metrics and sequence panels. */
    z-index: 40;
    background: rgba(11,15,20,.72);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: none;
    backdrop-filter: blur(8px);
    /* A generated structure name can be long — "nk2r_mutant_8to22" plus a
       source tag. Without a cap the box grows until it runs under the
       control bar at the top centre, and the name breaks mid-word where the
       two overlap. Cap it, ellipsize, and let the title attribute carry the
       full text.

       Flex, with the switcher pinned and only the text allowed to shrink.
       The switcher is a child of this box, and with plain inline layout a
       long name pushes it out past max-width where overflow:hidden clips it
       — the button keeps its tooltip, so it still looks clickable, but the
       click lands on nothing. flex-shrink:0 on the switcher and the
       ellipsis on the text keep the button on screen at any name length. */
    max-width: min(46vw, 420px);
    display: none;
    align-items: center;
    gap: 6px;
  }
  #structure-label.show { display: flex; }
  /* The text and the source tag share one shrinking box, so the ellipsis
     falls on whichever of them is longest. */
  #structure-label .src { color: var(--accent); flex-shrink: 0; }

  /* ---------- metrics panel ---------- */
  /* ---------- left column: metrics + sequence ---------- */
  #left-col {
    position: absolute;
    top: 58px; left: 16px;
    z-index: 10;
    width: min(400px, calc(100% - 300px));
    max-height: calc(100% - 120px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
  }
  #left-col:empty { display: none; }

  #metrics {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: none;
    flex-shrink: 0;
  }
  #metrics.show { display: block; }
  #metrics .m-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  #metrics .m-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 13px;
    padding: 2px 0;
  }
  #metrics .m-row .k { color: var(--muted); }
  #metrics .m-row .v { font-variant-numeric: tabular-nums; }
  /* Unit / direction hint, dimmed so the number still leads. */
  #metrics .m-hint {
    color: var(--muted);
    font-size: 11px;
    margin-left: 7px;
    opacity: .8;
  }
  #metrics .m-notes {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(34,48,64,.7);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ---------- sequence panel ---------- */
  #seq-panel {
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 12px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
    /* Taller than the old 220px so a dozen chains fit, but capped so the
       panel scrolls instead of swallowing the whole left column. */
    max-height: 420px;
    overflow: auto;
    flex-shrink: 0;
  }
  #seq-panel.show { display: block; }
  #seq-panel .seq-head {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  #seq-panel .seq-body {
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text);
    word-break: break-all;
    white-space: pre-wrap;
  }
  #seq-panel .seq-chain { margin-bottom: 10px; }
  #seq-panel .seq-chain:last-child { margin-bottom: 0; }
  #seq-panel .seq-chain-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  #seq-panel .seq-chain-name { letter-spacing: .02em; }
  #seq-panel .seq-eye {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    line-height: 1;
    color: #ffffff;
    opacity: .55;
    display: inline-flex;
    align-items: center;
  }
  #seq-panel .seq-eye svg { width: 13px; height: 13px; fill: currentColor; }
  #seq-panel .seq-eye:hover { opacity: 1; }
  #seq-panel .seq-eye.off { color: var(--muted); opacity: .8; }
  #seq-panel .seq-chain-seq { color: var(--text); }
  /* One span per residue so a drag can hit-test. Monospace keeps the
     letters on a fixed grid, which makes a drag across them land where the
     user expects rather than wherever a proportional font happens to put
     the next glyph. */
  #seq-panel .seq-chain-seq {
    font-family: monospace;
    line-height: 1.7;
    /* Letter spacing on the container, not the letters: it applies between
       every pair including the last of one row and the first of the next,
       so the grid stays even. In px rather than em so the pitch is exactly
       the 7 px asked for — the glyph is 6.4 px wide on its own, so this
       adds 0.6 px between neighbours. */
    letter-spacing: 0.6px;
    /* No word-break: the sequence is laid out in fixed 50-residue rows
     * rather than wrapped wherever the panel happens to end. Rows of a
     * known length line up between chains, so the same position in two
     * chains sits at the same x — which is what makes a comparison
     * readable. */
    user-select: none;
    cursor: crosshair;
  }
  /* One row of the sequence. `display: block` with the letters inline
     inside means the row is exactly as wide as its 50 letters and never
     breaks, so every row starts at the same x.
   *
     The negative right margin cancels the trailing letter-spacing that
     letter-spacing adds after the last letter — without it every row is
     one gap wider than its content, and a short last row leaves a visible
     stub of space. */
  #seq-panel .seq-row {
    display: block;
    white-space: nowrap;
    margin-right: -0.6px;
  }
  #seq-panel .seq-aa { border-radius: 2px; }
  #seq-panel .seq-aa:hover { background: rgba(77,163,255,.22); }
  /* The range being dragged right now. A hard colour rather than a tint:
     the letters underneath are already coloured by chain, and a translucent
     overlay on top of that reads as "dimmed" rather than "selected". */
  #seq-panel .seq-aa.seq-drag {
    background: var(--accent);
    color: #0b0f14;
  }
  /* Inside the drag and already selected: this one comes off when the
     mouse is released. Hollow rather than filled, so the two directions of
     the toggle read differently at a glance. */
  #seq-panel .seq-aa.seq-drag-off {
    background: transparent;
    color: var(--muted);
    text-decoration: line-through;
    opacity: .55;
  }
  /* Selected residues. The colour is set inline from the selection's own
     swatch, so a letter matches the highlight in the 3D view and the row in
     the Selection panel.
   *
   * No font-weight change: the sequence is monospace, and bolding it makes
   * every glyph wider, so selecting a residue shifts the letters after it
   * and the whole row reflows. The background already says "selected" — the
   * weight only made the text jump. */
  #seq-panel .seq-aa.seq-sel {
    color: #0b0f14;
  }

  /* ---------- state.selection panel ---------- */
  #selection {
    position: absolute;
    right: 16px; top: 58px;
    z-index: 10;
    width: 230px;
    max-height: calc(100% - 140px);
    overflow: auto;
    background: rgba(19,26,34,.78);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: none;
  }
  #selection.show { display: block; }
  /* Two rows: the title, then the mode switch and clear. One row crammed
     four mode buttons and "clear all" against the title and wrapped. */
  #selection .s-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  #selection .s-tools {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 10px;
  }
  #selection .s-clear {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
    text-transform: none;
    letter-spacing: 0;
  }
  #selection .s-clear:hover { text-decoration: underline; }
  #selection .s-mode {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #selection .s-mode-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 3px 8px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  #selection .s-mode-btn:hover { color: var(--text); }
  #selection .s-mode-btn.on {
    background: rgba(77,163,255,.18);
    color: var(--accent);
  }
  #selection .s-empty { font-size: 12px; color: var(--muted); line-height: 1.6; }
  #selection .s-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  #selection .s-row:hover { background: rgba(77,163,255,.1); }
  #selection .s-swatch {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  #selection .s-name { flex: 1; font-family: ui-monospace, Menlo, monospace; }
  #selection .s-del {
    background: none; border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0 2px;
  }
  #selection .s-del:hover { color: var(--err); }

  /* ---------- status bar ---------- */
  /* The status bar and the publish notice share one centred anchor. The
     wrapper is what is positioned and centred; the two pills inside it are
     laid out in a row, so the notice sits flush against the bar's left edge
     at any bar width. */
  #status-wrap {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    max-width: calc(100% - 32px);
  }
  #status {
    position: static;
    display: none;
    align-items: center;
    gap: 12px;
    background: rgba(19,26,34,.82);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 999px;
    padding: 9px 20px;
    font-size: 13px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 0 1px rgba(77,163,255,.08);
    max-width: calc(100% - 32px);
  }
  #status[data-state="running"] {
    border-color: rgba(77,163,255,.45);
    box-shadow: 0 8px 32px rgba(0,0,0,.55),
                0 0 18px rgba(77,163,255,.18);
  }
  #status[data-state="done"] { border-color: rgba(74,222,128,.45); }
  #status[data-state="error"] { border-color: rgba(248,113,113,.45); }
  #status.show { display: flex; }
  #status .dot {
    width: 15px; height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(125,143,163,.35);
    border-top-color: var(--muted);
    flex-shrink: 0;
  }
  #status[data-state="running"] .dot {
    border-color: rgba(77,163,255,.25);
    border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  #status[data-state="done"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--ok);
    border-radius: 50%;
    /* checkmark via clip-path */
    clip-path: polygon(
      14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  }
  #status[data-state="error"] .dot {
    border: none;
    width: 15px; height: 15px;
    background: var(--err);
    border-radius: 50%;
    clip-path: polygon(
      20% 0%, 0% 20%, 30% 50%, 0% 80%, 20% 100%,
      50% 70%, 80% 100%, 100% 80%, 70% 50%,
      100% 20%, 80% 0%, 50% 30%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* The message is one line, always. A long one used to wrap and grow the
     pill from a slim bar into a block covering the viewer — the status bar is
     the one thing that must stay out of the way while a run is going. It is
     capped and ellipsized instead, with the full text in the title attribute
     and in the history menu, where there is room to read it.

     `min-width: 0` is what lets the cap take effect: a flex item defaults to
     its content's width and will not shrink below it without it. */
  #status .msg {
    color: var(--text);
    min-width: 0;
    max-width: 46vw;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex-shrink: 1;
  }
  #status[data-state="error"] .msg { color: var(--err); }
  #status .bar {
    width: 120px; height: 6px;
    background: rgba(34,48,64,.9);
    border-radius: 3px;
    overflow: hidden;
    flex-shrink: 0;
  }
  #status .bar > div {
    height: 100%;
    background: linear-gradient(90deg, #2b7fd4, var(--accent));
    width: 0%;
    transition: width .5s ease;
    background-size: 20px 20px;
    background-image: linear-gradient(
      135deg,
      rgba(255,255,255,.22) 25%, transparent 25%,
      transparent 50%, rgba(255,255,255,.22) 50%,
      rgba(255,255,255,.22) 75%, transparent 75%);
    animation: stripes 1s linear infinite;
  }
  @keyframes stripes {
    from { background-position: 0 0; }
    to   { background-position: 20px 0; }
  }
  #status[data-state="done"] .bar > div {
    background: var(--ok);
    background-image: none;
    animation: none;
  }
  #status[data-state="error"] .bar > div {
    background: var(--err);
    background-image: none;
    animation: none;
  }
  #status .step { color: var(--muted); font-size: 12px; flex-shrink: 0; }

  /* ---------- machine load readout ---------- */
  /* Sits at the right end of the status pill. A vertical rule separates it
     from the progress text so the two groups read as one thing each. */
  #status .sys {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 12px;
    margin-left: 2px;
    border-left: 1px solid rgba(34,48,64,.9);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex-shrink: 0;
  }
  #status .sys-item {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
  #status .sys-item .k { opacity: .65; }
  #status .sys-item .v { color: var(--text); }
  /* Colour the number by how loaded the machine is, so a busy GPU is
     visible at a glance without reading the digits. */
  #status .sys-item.warn .v { color: #fbbf24; }
  #status .sys-item.hot .v { color: var(--err); }

  /* ---------- status history ---------- */
  /* The pill is centred near the bottom of the screen, so the menu opens
     upward from it rather than downward into the viewer. */
  #status .st-hist {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px; height: 22px;
    /* Sits at the left end of the pill, so the gap goes on its right. */
    margin-right: 2px;
    padding: 0;
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
  }
  #status .st-hist:hover {
    background: rgba(77,163,255,.14);
    border-color: rgba(77,163,255,.35);
    color: var(--accent);
  }
  #status .st-hist svg { width: 15px; height: 15px; fill: currentColor; }
  /* A structure was published while the user was elsewhere. It carries the
     accent colour and the structure's name, because unlike the history
     button it is not a control the user goes looking for — it is something
     that happened and is waiting.

     A sibling of #status, positioned against the same centre point and
     pulled left by its own width plus the gap, so it sits flush against the
     status bar's left edge. The negative right margin closes the seam: the
     notice's right border-radius is squared off and the status pill's left
     one is too, so the two read as one control rather than two pills that
     happen to touch.

     `[hidden]` is restated because the display rule below would otherwise
     win on specificity and the button would never disappear. */
  /* A structure was published while the user was elsewhere. A small circle
     with a bell, matching the status bar's own dot in size and weight — it
     says "something is waiting" without claiming any of the bar's width, and
     the structure's name is in the tooltip.

     A sibling of #status inside #status-wrap, so it sits beside the bar
     rather than stretching it.

     `[hidden]` is restated because the display rule below would otherwise
     win on specificity and the button would never disappear. */
  .st-notice[hidden] { display: none; }
  .st-notice {
    display: flex;
    align-items: center;
    justify-content: center;
    /* The status pill is 9px of padding either side of a 13px line, so it
       stands about 39px tall. Matching that here keeps the circle on the
       same optical line as the bar instead of sitting small beside it. */
    width: 39px; height: 39px;
    margin-right: 8px;
    padding: 0;
    /* Amber, not the accent blue. The status bar already uses blue for a run
       in progress, so a blue notice reads as more of the same and gets skimmed
       past; red is taken for errors, and a new structure is not an error. It
       is something waiting, which is what amber means everywhere else. */
    background: rgba(251,191,36,.14);
    border: 1px solid rgba(251,191,36,.55);
    border-radius: 50%;
    color: var(--warn);
    cursor: pointer;
    flex-shrink: 0;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .st-notice:hover {
    background: rgba(251,191,36,.26);
    border-color: rgba(251,191,36,.95);
  }
  .st-notice svg { width: 17px; height: 17px; fill: currentColor; }
  /* The name is kept in the DOM for the tooltip and for tests, but it is not
     drawn — the circle carries the bell and nothing else. */
  .st-notice-name { display: none; }
  #status .st-menu {
    position: absolute;
    /* Absolute, so it does not take a slot in the pill's flex row and
       push the progress bar off centre while closed. Anchored to the left
       edge, under the chevron that opens it. */
    bottom: calc(100% + 8px);
    left: 0;
    width: min(420px, calc(100vw - 32px));
    max-height: 60vh;
    overflow-y: auto;
    background: rgba(19,26,34,.97);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 -10px 32px rgba(0,0,0,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 30;
    scrollbar-width: thin;
  }
  #status .st-menu:empty { display: none; }
  /* ---------- a task and its steps ---------- */
  /* A long run is a sequence of small tasks. Each step keeps its own row so
     a finished one stays visible and clickable, and the task heading above
     them says which run they belong to and how far it has got. */
  #status .st-task {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 9px 9px 3px;
    font-size: 11.5px;
    color: var(--text);
  }
  #status .st-task-name {
    font-weight: 600;
    letter-spacing: .01em;
  }
  #status .st-task-prog {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  /* Clear the whole task. The task list is the record of every run this
     session, and without this it grows into a history of everything rather
     than a list of what is open now. It sits on the heading rather than a
     step because it removes all of them, and it is quiet until hovered so
     the heading still reads as a name and a count. */
  #status .st-task-del {
    margin-left: 6px;
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s, background .12s, color .12s;
  }
  #status .st-task:hover .st-task-del { opacity: .7; }
  #status .st-task-del:hover {
    opacity: 1;
    background: rgba(255,107,107,.16);
    color: #ff8f8f;
  }
  #status .st-task-del:disabled {
    cursor: default;
    opacity: .25;
  }
  /* Steps sit under their task heading, indented so the hierarchy reads at
     a glance without a tree widget. */
  #status .st-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 9px 7px 20px;
    border-radius: 7px;
    font-size: 12px;
    line-height: 1.45;
  }
  #status .st-row + .st-row {
    border-top: 1px solid rgba(34,48,64,.5);
  }
  #status .st-row .st-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
    background: var(--muted);
  }
  #status .st-row[data-state="running"] .st-dot { background: var(--accent); }
  #status .st-row[data-state="done"] .st-dot { background: var(--ok); }
  #status .st-row[data-state="error"] .st-dot { background: var(--err); }
  #status .st-row .st-body { flex: 1; min-width: 0; }
  /* One line here too, for the same reason as the pill: a row that wraps to
     four lines pushes the other steps of the task out of view, and the menu
     is a list to scan rather than a place to read. The full text is in the
     row's title. */
  #status .st-row .st-msg {
    color: var(--text);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #status .st-row[data-state="error"] .st-msg { color: var(--err); }
  #status .st-row .st-meta {
    display: flex;
    gap: 8px;
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--muted);
  }
  /* Group headings — 运行中 / 排队中 / 已完成. Small caps rather than a
     coloured bar: the menu is already dense, and the dot on each row carries
     the state. */
  #status .st-group {
    padding: 8px 9px 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    opacity: .75;
  }
  #status .st-group:first-child { padding-top: 4px; }
  /* The step currently on the pill, so the menu says which row is the one
     being shown at the bottom of the screen. */
  #status .st-row.on { background: rgba(77,163,255,.14); }
  /* A finished step leads somewhere. The pointer and the hover tint say so
     without adding a chevron or a label — the row already carries a state
     dot, and a third affordance would be noise. */
  #status .st-row.st-clickable { cursor: pointer; }
  #status .st-row.st-clickable:hover { background: rgba(77,163,255,.12); }
  /* A running step's progress, inline under its message. Narrower than the
     pill's bar — this one is a glance, not the primary readout. */
  #status .st-row .st-bar {
    width: 100%;
    height: 3px;
    margin-top: 5px;
    background: rgba(34,48,64,.9);
    border-radius: 2px;
    overflow: hidden;
  }
  #status .st-row .st-bar > div {
    height: 100%;
    background: var(--accent);
    transition: width .5s ease;
  }
  #status .st-row .st-skill { color: var(--accent); opacity: .8; }
  /* A step's own numbers, under its message. Same label/value layout as the
     metrics panel so a figure reads identically in both places, at the
     smaller size the menu runs at. */
  #status .st-metrics {
    margin-top: 5px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  #status .st-metrics .m-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 11px;
    line-height: 1.5;
  }
  #status .st-metrics .m-row .k { color: var(--muted); }
  #status .st-metrics .m-row .v {
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  #status .st-metrics .m-hint {
    color: var(--muted);
    font-size: 10px;
    margin-left: 6px;
    opacity: .8;
  }
  #status .st-empty {
    padding: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- structure switcher ---------- */
  /* One entry per structure the viewer has loaded this session, so results
     from different runs stay available instead of replacing each other.
   *
   * A dropdown rather than a row of tabs: a row of four or more runs the
   * width of the viewer and pushes the top controls around. The dropdown
   * lives inside the structure label at the top left, next to the name of
   * what is on screen. */
  /* Static, not relative: the menu is positioned against #structure-label
     so it opens flush with the label's left edge instead of hanging off
     the button, which sits to the right of the structure name. */
  #struct-switcher {
    display: none;
    /* Never shrink. The label is a flex row capped at max-width, and this is
       the one child that must stay its full size — a clipped button still
       shows its tooltip and still looks clickable. */
    flex-shrink: 0;
    /* The label is 13px text with 6px of vertical padding; the icon button
       is 32px tall, so it needs a small negative margin to sit on the same
       optical line as the name instead of stretching the label. */
    margin: -3px 2px -3px 0;
    vertical-align: middle;
  }
  #struct-switcher.show { display: inline-block; }
  /* The structure name, in its own box so the ellipsis has something to
     apply to. A bare text node in a flex container cannot be ellipsized —
     it just overflows and takes the switcher with it. */
  #structure-label .st-name {
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  #struct-switcher > button {
    flex-shrink: 0;
    /* .ctl.icon is sized for the top control bar; scale it down to sit
       beside 13px label text. */
    width: 22px; height: 22px;
    padding: 4px;
    border-radius: 5px;
  }
  #struct-switcher > button svg { width: 13px; height: 13px; }
  #struct-switcher .sw-menu {
    position: absolute;
    /* Anchored to #structure-label (the nearest positioned ancestor), so
       the menu's left edge lines up with the label's left edge. */
    top: calc(100% + 5px);
    left: 0;
    min-width: 230px;
    background: rgba(19,26,34,.96);
    border: 1px solid rgba(34,48,64,.9);
    border-radius: 10px;
    padding: 5px;
    box-shadow: 0 10px 32px rgba(0,0,0,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 30;
  }
  #struct-switcher .sw-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  #struct-switcher .sw-row:hover { background: rgba(77,163,255,.12); color: var(--text); }
  #struct-switcher .sw-row.on { color: var(--text); background: rgba(77,163,255,.16); }
  #struct-switcher .sw-row .sw-name { flex: 1; }
  #struct-switcher .sw-row .sw-src { color: var(--accent); font-size: 10px; }
  #struct-switcher .sw-row .sw-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  /* A task heading above the structures it produced. Small caps rather
     than a coloured bar: the rows below already carry a dot for the active
     one, and a second visual language would compete with it. */
  #struct-switcher .sw-group {
    padding: 7px 9px 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    opacity: .75;
  }
  #struct-switcher .sw-group:first-child { padding-top: 3px; }
  #struct-switcher .sw-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 0 3px;
    border-radius: 50%;
  }
  #struct-switcher .sw-close:hover { color: var(--err); }
</style>
</head>
<body>

<div id="viewer-wrap">
  <div id="viewer"></div>
  <div id="hover-tip" hidden></div>
  <div id="viewer-hint">
    <div class="big">No structure loaded</div>
    <div class="small">
      Ask your agent to run a BioBench skill, e.g.
      <em>"design a binder for NK2R"</em> or <em>"show me 7xwo"</em>.
      Results appear here automatically.
    </div>
  </div>
</div>

<div id="structure-label"><span id="struct-switcher"></span></div>

<div id="topbar">
    <select id="style-picker" class="ctl" disabled>
      <option value="surface">Surface</option>
      <option value="cartoon">Cartoon</option>
      <option value="stick">Stick</option>
      <option value="sphere">Sphere</option>
      <option value="line">Line</option>
    </select>
    <select id="color-picker" class="ctl" disabled>
      <option value="chain">By chain</option>
      <option value="spectrum">Spectrum</option>
      <option value="secondary">Secondary</option>
    </select>
    <select id="ligand-style-picker" class="ctl" disabled title="Ligand rendering">
      <option value="stick">Stick</option>
      <option value="ballstick">Ball &amp; stick</option>
      <option value="spacefill">Space fill</option>
      <option value="line">Line</option>
    </select>
    <button id="reset-btn" class="ctl icon" disabled title="Reset view">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97-.7-2.8L3.84 11.66C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" opacity="0"/><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div id="selection">
    <div class="s-head">
      <span>Selection</span>
      <button class="s-clear" id="sel-clear">clear all</button>
    </div>
    <div class="s-tools">
      <span class="s-mode" id="sel-mode" title="What a click selects: a residue, a whole chain, a single atom, or a bond">
        <button class="s-mode-btn on" data-mode="res">Res</button>
        <button class="s-mode-btn" data-mode="chain">Chain</button>
        <button class="s-mode-btn" data-mode="atom">Atom</button>
        <button class="s-mode-btn" data-mode="bond">Bond</button>
      </span>
    </div>
    <div id="sel-list"></div>
  </div>

<div id="left-col">
  <div id="metrics">
    <div class="m-title">Metrics</div>
    <div id="metrics-rows"></div>
    <div class="m-notes" id="metrics-notes"></div>
  </div>

  <div id="seq-panel">
    <div class="seq-head">
      <span id="seq-title">Sequence</span>
      <span id="seq-len"></span>
    </div>
    <div class="seq-body" id="seq-body"></div>
  </div>
</div>

<!-- A structure was published while the user was looking at something else.
     The tab is already open; this says so, and clicking it goes there.

     A sibling of #status rather than a child, so it keeps its own pill shape
     and sits beside the status bar instead of stretching it. The two are
     positioned against the same point and the notice carries a negative
     right margin, so they read as one control with the notice as its left
     end — which is where the one thing waiting for the user belongs. -->
<!-- The status bar and the publish notice share one centred anchor, so they
     are wrapped: the wrapper is what gets centred and the two pills sit in it
     side by side. Centred separately, each would land wherever its own width
     put it and the notice would not line up with the bar. -->
<div id="status-wrap">
<button class="st-notice" id="st-notice" type="button" hidden
        title="有新结构发布，点击查看">
  <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25-2 6.5-2 6.5h18S19 14.25 19 9a7 7 0 0 0-7-7zM9.5 19a2.5 2.5 0 0 0 5 0z"/></svg>
  <span class="st-notice-name"></span>
</button>

<div id="status">
  <!-- Past runs. The pill shows only the newest status, so without this a
       finished run leaves no trace of what it did. The chevron points up
       because the menu opens upward from the pill — the same triangle the
       structure switcher uses at the top left, turned over, so the two read
       as the same kind of control. It sits at the left end so the progress
       text and machine load stay together on the right. -->
  <button class="st-hist" id="st-hist" type="button" title="历史任务">
    <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
  </button>
  <span class="dot"></span>
  <span class="msg"></span>
  <span class="bar"><div></div></span>
  <span class="step"></span>
  <!-- Machine load, so a slow run can be told apart from a hung one. -->
  <span class="sys" id="sys">
    <span class="sys-item" id="sys-cpu" title="CPU 占用率"></span>
    <span class="sys-item" id="sys-gpu" title="GPU 占用率" hidden></span>
    <span class="sys-item" id="sys-mem" title="内存占用"></span>
  </span>
  <div class="st-menu" id="st-menu" hidden></div>
</div>
</div>

<script>
// A browser caps the number of live WebGL contexts (~16 in Chrome). Each
// 3Dmol viewer holds one, so a page that has created and abandoned many
// viewers — or several tabs of this app — eventually gets null back from
// getContext and the canvas stays blank with no explanation. Detect that
// and say so, with the fix.
function webglAvailable() {
  try {
    const c = document.createElement("canvas");
    return !!(c.getContext("webgl2") || c.getContext("webgl"));
  } catch (e) {
    return false;
  }
}

const viewer = $3Dmol.createViewer("viewer", { backgroundColor: "0b0f14" });

/* ================= state =================
 *
 * Everything mutable lives here. The viewer previously kept eight
 * top-level variables — selection, hiddenChains, tabs, activeTab, chains,
 * state.meta, lastUpdated, state.structureName — and every one of them was
 * read and written from several unrelated functions. That is what made the
 * tab bugs so hard to pin down: a state.selection could be saved, cleared, and
 * repainted by three different callers with no single place to look.
 *
 * One object, mutated only through the helpers below, so the question
 * "what is selected right now" has exactly one answer.
 */
const state = {
  /** Chains of the loaded structure: [{chain, seq, residues}] */
  chains: [],
  /** current.json of the active structure */
  meta: {},
  /** Timestamp of the contract file the active tab was loaded from */
  lastUpdated: null,
  /** Timestamp last seen in current.json, independent of which tab is shown */
  contractUpdated: null,
  /** Name of the structure the publish notice is offering, or null if none */
  noticeName: null,
  /** Name of the active structure, for selection.json */
  structureName: null,
  /** key → {sel, label, color, chain?, atom?, bond?, pocket?} */
  selection: {},
  /** Chain IDs hidden by the eye toggles */
  hiddenChains: new Set(),
  /** "res" | "chain" | "atom" | "bond" */
  selMode: "res",
  /** Residue currently under the cursor, for the hover preview */
  hover: null,
  /** Loaded structures: [{text, meta, state}] */
  tabs: [],
  /** Index into tabs of the structure on screen */
  activeTab: -1,
  /**
   * Job id the user pinned by clicking a status row, or null.
   *
   * Clicking a step shows the structure that step belongs to, which is not
   * always a structure that step's task produced — "preparing the receptor"
   * points at the input, which another task published. Deriving the pill
   * from the tab alone would then show that other task's status, and the row
   * the user just clicked would stop being the one on screen. The pin keeps
   * the clicked step selected until something else takes over: a new
   * publish, or the user clicking another row.
   */
  pinnedJob: null,
};

// Snapshot the per-structure part of the state, so a tab can restore it.
function captureState() {
  return {
    selection: JSON.parse(JSON.stringify(state.selection)),
    hiddenChains: [...state.hiddenChains],
  };
}

// Install a snapshot taken by captureState. Called before anything reads
// the state.selection — applyStyle() paints from it, so restoring afterwards
// leaves the previous structure's highlights on screen.
function restoreState(snap) {
  state.selection = snap && snap.selection ? snap.selection : {};
  state.hiddenChains = new Set(snap && snap.hiddenChains ? snap.hiddenChains : []);
}

if (!webglAvailable()) {
  const hint = document.getElementById("viewer-hint");
  hint.classList.remove("hidden");
  hint.innerHTML =
    '<div class="big">3D 渲染不可用</div>' +
    '<div class="small">浏览器已达到 WebGL 上下文上限。' +
    '关闭其他标签页后刷新此页面即可恢复。</div>';
}

const hint = document.getElementById("viewer-hint");
const label = document.getElementById("structure-label");
// The structure switcher lives inside the label, so it is grabbed here
// alongside it rather than down with the tab code — renderStructure runs
// before that point and would otherwise hit the temporal dead zone.
const switcher = document.getElementById("struct-switcher");
const metricsPanel = document.getElementById("metrics");
const metricsRows = document.getElementById("metrics-rows");
const metricsNotes = document.getElementById("metrics-notes");
const seqPanel = document.getElementById("seq-panel");
const seqTitle = document.getElementById("seq-title");
const seqLen = document.getElementById("seq-len");
const seqBody = document.getElementById("seq-body");
const statusBar = document.getElementById("status");

// Shapes and labels are kept separately because 3Dmol removes them through
// different calls — removeShape for the cylinder, removeLabel for the text
// sprite. Passing one to the other's remover is a silent no-op, which would
// leave the old label on screen forever.
//
// Declared here, next to the other DOM handles, because renderStructure
// clears them and runs long before the distance-line code below.
let distShapes = [];
let distLabels = [];

const AA3TO1 = {
  ALA:'A', ARG:'R', ASN:'N', ASP:'D', CYS:'C', GLN:'Q', GLU:'E', GLY:'G',
  HIS:'H', ILE:'I', LEU:'L', LYS:'K', MET:'M', PHE:'F', PRO:'P', SER:'S',
  THR:'T', TRP:'W', TYR:'Y', VAL:'V',
  MSE:'M', SEC:'U', PYL:'O', HYP:'P', SEP:'S', TPO:'T', PTR:'Y'
};

/* ---------------- structure rendering ---------------- */

function extractChains(model) {
  if (!model || !model.selectedAtoms) return [];
  let atoms = [];
  try { atoms = model.selectedAtoms({}) || []; } catch (e) { return []; }

  const byChain = new Map();
  atoms.forEach(a => {
    if (!a) return;
    const one = AA3TO1[(a.resn || "").toUpperCase()];
    if (!one) return;
    const chain = a.chain || "_";
    if (!byChain.has(chain)) byChain.set(chain, new Map());
    const residues = byChain.get(chain);
    const key = a.resi != null ? a.resi : a.serial;
    if (!residues.has(key)) residues.set(key, one);
  });

  return [...byChain.entries()].map(([chain, residues]) => ({
    chain,
    seq: [...residues.values()].join(""),
    residues: [...residues.keys()]
  }));
}

// Chains the user has hidden. Kept across style/state.selection changes so
// hiding survives a re-render; restored per tab when switching.
function chainHidden(chainId) {
  return state.hiddenChains.has(chainId);
}

// Eye / eye-off icons. Inline SVG rather than emoji so the colour can be
// controlled and the glyph stays crisp at 13px.
const EYE_ON =
  '<svg viewBox="0 0 24 24"><path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>';
const EYE_OFF =
  '<svg viewBox="0 0 24 24"><path d="M2 4.3 3.4 3 21 20.6 19.6 22l-3.1-3.1A11 11 0 0 1 12 19c-5 0-9.3-3.1-11-7a12.6 12.6 0 0 1 4.2-5.2L2 4.3zM12 7a5 5 0 0 1 4.7 6.7l-2-2A3 3 0 0 0 10.3 9.3l-2-2A5 5 0 0 1 12 7zm10 5c-.6 1.4-1.6 2.7-2.9 3.8l-1.5-1.5A9.9 9.9 0 0 0 19.4 12a9.8 9.8 0 0 0-4.4-4.3l-1.5-1.5A11 11 0 0 1 12 5c5 0 9.3 3.1 11 7z"/></svg>';

// Residues per line in the sequence panel. A fixed count rather than
// wrapping to the panel width: rows of a known length line up between
// chains, so the same position in two chains sits at the same x and the
// two can be read against each other. 50 is the convention sequence
// viewers have settled on and fits the panel without scrolling.
const SEQ_ROW_LEN = 50;

// One row per chain: an eye toggle on the left, the chain name, and the
// sequence underneath. Clicking the eye hides that chain in the 3D view.
function chainRow(chainId, label, seqText) {
  const row = document.createElement("div");
  row.className = "seq-chain";

  const head = document.createElement("div");
  head.className = "seq-chain-head";

  const hidden = chainHidden(chainId);
  const eye = document.createElement("button");
  eye.className = "seq-eye" + (hidden ? " off" : "");
  eye.type = "button";
  eye.title = hidden ? "Show this chain" : "Hide this chain";
  eye.innerHTML = hidden ? EYE_OFF : EYE_ON;
  eye.addEventListener("click", () => {
    if (state.hiddenChains.has(chainId)) {
      state.hiddenChains.delete(chainId);
    } else {
      state.hiddenChains.add(chainId);
    }
    // Rebuild the sequence first, then style. applyStyle ends with
    // paintSequenceSelection, which paints the selection onto the
    // .seq-aa elements — and renderSequence replaces those elements via
    // innerHTML. The other order paints the old DOM and the new letters
    // come up blank, so a selected residue loses its highlight the moment
    // any chain's eye is toggled.
    renderSequence(null);
    applyStyle();
  });

  const name = document.createElement("span");
  name.className = "seq-chain-name";
  name.textContent = label;

  head.append(eye, name);
  row.appendChild(head);

  if (seqText) {
    const body = document.createElement("div");
    body.className = "seq-chain-seq";
    // One span per residue rather than a single text node: a drag across
    // the sequence has to know which residues it crossed, and that needs
    // something to hit-test against. `residues` is the parallel array of
    // residue numbers from extractChains — same order as the letters.
    const resNums = (state.chains.find(c => c.chain === chainId) || {}).residues || [];
    const letters = [...seqText];
    // Fixed-width rows of SEQ_ROW_LEN. Letting the browser wrap wherever
    // the panel ends puts a different number of letters on each line, so
    // residue 100 sits at one x in chain A and another in chain B — the two
    // sequences cannot be read against each other. Rows of a known length
    // line up, and the last row is simply short.
    for (let start = 0; start < letters.length; start += SEQ_ROW_LEN) {
      const line = document.createElement("span");
      line.className = "seq-row";
      for (let i = start; i < Math.min(start + SEQ_ROW_LEN, letters.length); i++) {
        const s = document.createElement("span");
        s.className = "seq-aa";
        s.textContent = letters[i];
        s.dataset.chain = chainId;
        if (resNums[i] !== undefined) s.dataset.resi = resNums[i];
        line.appendChild(s);
      }
      body.appendChild(line);
    }
    row.appendChild(body);
  }
  return row;
}

/* ---------------- sequence drag selection ---------------- */

// Dragging across the sequence selects every residue crossed, the same way
// dragging across text in an editor selects a range. Clicking a single
// letter still selects just that residue.
//
// The letters are spans with data-chain / data-resi, so the range is read
// off the DOM rather than computed from pixel offsets — which would need
// the font metrics and break the moment the panel is scrolled or wrapped.

let seqDrag = null;   // { chain, anchorResi, currentResi } while dragging
let seqDragMoved = false;

function seqLetterFromEvent(ev) {
  const el = ev.target.closest ? ev.target.closest(".seq-aa") : null;
  if (!el || el.dataset.resi === undefined) return null;
  return { chain: el.dataset.chain, resi: el.dataset.resi, el };
}

// Residues between two positions in one chain, inclusive, in sequence
// order. The letters are laid out in the order extractChains saw them, so
// the index range is the answer — no need to sort by residue number, which
// would be wrong for a chain with insertion codes or non-contiguous
// numbering.
function seqRange(chainId, fromResi, toResi) {
  const info = state.chains.find(c => c.chain === chainId);
  if (!info) return [];
  const i = info.residues.findIndex(r => String(r) === String(fromResi));
  const j = info.residues.findIndex(r => String(r) === String(toResi));
  if (i < 0 || j < 0) return [];
  const [lo, hi] = i <= j ? [i, j] : [j, i];
  return info.residues.slice(lo, hi + 1);
}

function seqApplyDrag() {
  if (!seqDrag) return;
  const { chain, anchorResi, currentResi } = seqDrag;
  const range = seqRange(chain, anchorResi, currentResi);

  // Toggle the dragged range against what is already selected.
  //
  // A drag adds the residues it covers, except the ones already selected —
  // those come off. That makes the gesture its own inverse: drag the same
  // stretch twice and it is back to unselected, and dragging across a
  // selection that runs off the end of the range trims it rather than
  // growing it. Selecting a set of hotspots is a process of refinement, and
  // without this the only way to remove a residue is to find its row in the
  // Selection panel and click the ×.
  //
  // A plain click on one letter lands here with a one-element range, so it
  // toggles that single residue — the same behaviour as clicking it in the
  // 3D view.
  range.forEach(resi => {
    const key = `${chain}:${resi}`;
    if (state.selection[key]) {
      delete state.selection[key];
      return;
    }
    const atom = (viewer.getModel().atoms || [])
      .find(a => a.chain === chain && String(a.resi) === String(resi));
    state.selection[key] = {
      sel: { chain, resi: isNaN(Number(resi)) ? resi : Number(resi) },
      label: atom ? selLabel(atom) : `${chain}:${resi}`,
      color: nextColor(chain),
    };
  });
  applyStyle();
  renderSelectionPanel();
  persistSelection(Object.keys(state.selection));
}

// Paint the range as it is dragged, so the user sees what the gesture will
// do. Letters already selected and inside the range are marked for removal
// rather than addition — the preview has to show the toggle, not just the
// add, or dragging over an existing selection looks like it will do
// nothing.
function seqPaintDrag() {
  if (!seqDrag) return;
  const { chain, anchorResi, currentResi } = seqDrag;
  const inRange = new Set(seqRange(chain, anchorResi, currentResi).map(String));
  document.querySelectorAll(".seq-aa").forEach(el => {
    if (el.dataset.chain !== chain) return;
    el.classList.remove("seq-drag", "seq-drag-off");
    if (!inRange.has(el.dataset.resi)) return;
    const key = `${chain}:${el.dataset.resi}`;
    if (state.selection[key]) {
      el.classList.add("seq-drag-off");
    } else {
      el.classList.add("seq-drag");
    }
  });
}

document.addEventListener("mousedown", ev => {
  // Ignore a press that lands outside the sequence, and ignore a second
  // press while a drag is already running — without the guard a stray
  // mousedown mid-drag re-anchors the range and the selection jumps to
  // wherever the pointer happened to be.
  if (seqDrag) return;
  const hit = seqLetterFromEvent(ev);
  if (!hit) return;
  // Only the primary button starts a drag; a right-click should still open
  // the context menu.
  if (ev.button !== 0) return;
  ev.preventDefault();
  seqDrag = { chain: hit.chain, anchorResi: hit.resi, currentResi: hit.resi };
  seqDragMoved = false;
  seqPaintDrag();
});

document.addEventListener("mousemove", ev => {
  if (!seqDrag) return;
  const hit = seqLetterFromEvent(ev);
  // A drag stays inside one chain: crossing into another chain's block
  // leaves the range where it was rather than measuring across two
  // different sequences, whose residue numbers are unrelated.
  if (!hit || hit.chain !== seqDrag.chain) return;
  if (hit.resi !== seqDrag.currentResi) {
    seqDrag.currentResi = hit.resi;
    seqDragMoved = true;
    seqPaintDrag();
  }
});

document.addEventListener("mouseup", () => {
  if (!seqDrag) return;
  const drag = seqDrag;
  seqDrag = null;
  // Both preview classes, not just the add one. Leaving seq-drag-off
  // behind strands the strikethrough on letters that are no longer being
  // dragged — and since the class also drops the background, the letter
  // reads as deselected while the Selection panel still lists it.
  document.querySelectorAll(".seq-aa.seq-drag, .seq-aa.seq-drag-off")
    .forEach(el => el.classList.remove("seq-drag", "seq-drag-off"));
  // A click that never moved is a single-residue selection, which
  // seqApplyDrag already produces from a one-element range — so both paths
  // go through the same code.
  seqDrag = drag;
  seqApplyDrag();
  seqDrag = null;
});

function renderSequence(chainInfo) {
  if (!chainInfo) {
    // "All chains" selected — one block per chain, each with its own hide
    // toggle. Ligand chains carry no amino acids so extractChains skips
    // them; take them from the metadata so every chain on screen is listed.
    const ligandChains = (state.meta.chains || []).filter(c => c.ligand);
    if (!state.chains.length && !ligandChains.length) {
      seqPanel.classList.remove("show");
      return;
    }
    seqTitle.textContent = "All chains";
    seqLen.textContent = `${state.chains.length + ligandChains.length} chains`;
    seqBody.innerHTML = "";
    state.chains.forEach(c => {
      const role = ((state.meta.chains || []).find(m => m.id === c.chain) || {}).role;
      const label = `Chain ${c.chain}${role ? " — " + role : ""}  (${c.seq.length} aa)`;
      seqBody.appendChild(chainRow(c.chain, label, c.seq));
    });
    ligandChains.forEach(c => {
      const label = `Ligand ${c.id}${c.role ? " — " + c.role : ""}  (${c.residues} res)`;
      seqBody.appendChild(chainRow(c.id, label, ""));
    });
    seqPanel.classList.add("show");
    return;
  }
  seqTitle.textContent = `Chain ${chainInfo.chain}`;
  seqLen.textContent = `${chainInfo.seq.length} residues`;
  seqBody.innerHTML = "";
  seqBody.appendChild(chainRow(
    chainInfo.chain,
    `Chain ${chainInfo.chain}  (${chainInfo.seq.length} aa)`,
    chainInfo.seq));
  seqPanel.classList.add("show");
}

// Metrics come from many tools and span wildly different scales — an
// e-value of 1.4e-30 and a bit score of 1516 both have to stay readable.
// toFixed(3) turns the former into "0.000", so very small and very large
// magnitudes fall back to exponential / compact notation.
//
// Decimals are kept as written rather than rounded to a fixed width: a
// cLogP of -4.73 is a measurement with two significant decimals, and
// showing -4.7 silently drops one. Only trailing zeros are trimmed, so
// 0.570 still reads as 0.57 and 12 stays 12.
function formatMetric(v) {
  if (typeof v !== "number") return String(v);
  if (v === 0) return "0";
  const abs = Math.abs(v);
  if (abs < 0.001 || abs >= 1e6) return v.toExponential(2);
  if (Number.isInteger(v)) return String(v);
  // Enough places to keep the value's own precision, then trim the zeros.
  return parseFloat(v.toFixed(4)).toString();
}

// A metric entry is either a bare value or an object the skill wrote
// itself:
//   {"label": "ri 柔性对接", "value": -9.12, "hint": "kcal/mol，越负越强"}
// The viewer keeps no vocabulary of its own — the skill names its metrics
// and decides how much to explain. A bare number still renders, so a
// quick publish never has to invent a label.
function metricParts(key, entry) {
  if (entry && typeof entry === "object" && !Array.isArray(entry)) {
    return {
      label: entry.label || key,
      value: "value" in entry ? entry.value : "",
      hint: entry.hint || ""
    };
  }
  return { label: key, value: entry, hint: "" };
}

function renderMetrics(meta) {
  const m = meta.metrics || {};
  const keys = Object.keys(m);
  if (!keys.length && !meta.notes) {
    metricsPanel.classList.remove("show");
    return;
  }
  metricsRows.innerHTML = "";
  keys.forEach(k => {
    const { label, value, hint } = metricParts(k, m[k]);
    const row = document.createElement("div");
    row.className = "m-row";
    row.innerHTML = `<span class="k"></span><span class="v"></span>`;
    row.querySelector(".k").textContent = label;
    const v = row.querySelector(".v");
    v.textContent = (value === undefined || value === null)
      ? "" : formatMetric(value);
    if (hint) {
      const h = document.createElement("span");
      h.className = "m-hint";
      h.textContent = hint;
      v.appendChild(h);
    }
    metricsRows.appendChild(row);
  });
  // notes carries the skill's explanation and suggestion; keep it verbatim
  // so the wording the skill chose is what the user reads.
  metricsNotes.textContent = meta.notes || "";
  metricsNotes.style.display = meta.notes ? "" : "none";
  metricsPanel.classList.add("show");
}

const stylePicker = document.getElementById("style-picker");
const colorPicker = document.getElementById("color-picker");
const ligandStylePicker = document.getElementById("ligand-style-picker");
const resetBtn = document.getElementById("reset-btn");

// `snap` is a per-tab snapshot from captureState(), or null for a
// structure arriving fresh from a publish.
function renderStructure(data, meta, snap) {
  state.meta = meta;

  // Restore this tab's selection before anything reads it.
  //
  // state.selection and state.hiddenChains still hold the previous tab's
  // contents on entry. applyStyle() below paints from them, so restoring
  // afterwards left the old tab's highlights drawn on the new structure
  // while the panel showed the new tab's state — a residue appearing
  // selected in two tabs at once, and the tab it belonged to showing
  // nothing.
  restoreState(snap);

  const fmt = meta.format === "pdb" ? "pdb" : "mmcif";

  // Clear, then build, then render — all before yielding to the browser.
  //
  // The flicker came from removeAllModels() emptying the scene while
  // render() was not reached until the styles were set several statements
  // later; the browser painted one blank frame in between. Everything from
  // here to viewer.render() is synchronous, so no frame is produced until
  // the new model is fully styled.
  //
  // removeModel(id) is not an alternative: viewer.models is a sparse array
  // keyed by ID, and deleting a middle entry leaves its length unchanged,
  // so the model count climbs on every poll even though only one is drawn.
  //
  // Any distance line belongs to the model going away — its coordinates are
  // meaningless in the new structure's frame. Clearing it here rather than
  // in drawDistanceLines keeps a stale line from flashing for one frame
  // between the model swap and the next applyStyle.
  clearDistanceLines();
  viewer.removeAllModels();
  viewer.addModel(data, fmt);

  // removeAllModels() clears click bindings — re-attach for the new model
  viewer.setClickable({}, true, onAtomClick);
  // 3Dmol waits 500 ms before firing a hover, which feels laggy for a
  // tooltip that is only naming the residue under the cursor.
  viewer.setHoverDuration(0);
  viewer.setHoverable({}, true, onAtomHover, onHoverOut);

  state.chains = extractChains(viewer.getModel());
  const isPeptide = state.chains.length > 0;
  if (isPeptide) {
    applyStyle();
  } else {
    // Non-protein (ligands, nucleic acids): plain sticks
    viewer.setStyle({}, { stick: { radius: 0.15, colorscheme: "Jmol" } });
  }
  viewer.zoomTo();
  viewer.render();

  hint.classList.add("hidden");
  // Clear only the text and the source tag, not the children — the structure
  // switcher lives in this element and innerHTML="" would drop it on every
  // render.
  [...label.childNodes].forEach(n => {
    if (n.nodeType === Node.TEXT_NODE) n.remove();
    if (n.nodeType === Node.ELEMENT_NODE
        && (n.classList.contains("src") || n.classList.contains("st-name"))) {
      n.remove();
    }
  });
  // The switcher goes first so the button sits at the label's left edge,
  // with the structure name and source following it.
  //
  // The name goes in a span of its own. The label is a flex row capped at
  // max-width, and a bare text node cannot be ellipsized in one — it
  // overflows instead, and the overflow pushes the switcher out of the box
  // where overflow:hidden clips it. The button keeps its tooltip and still
  // looks clickable, but the click lands on nothing.
  const name = document.createElement("span");
  name.className = "st-name";
  name.textContent = meta.name || "structure";
  label.insertBefore(name, switcher.nextSibling);
  if (meta.source) {
    const src = document.createElement("span");
    src.className = "src";
    src.textContent = `  ·  ${meta.source}`;
    label.appendChild(src);
  }
  // The label ellipsizes when the name is long, so the full text goes in the
  // tooltip — otherwise a truncated name is all the user ever sees.
  const fullName = (meta.name || "structure") +
                   (meta.source ? `  ·  ${meta.source}` : "");
  label.title = fullName;
  label.classList.add("show");

  // The view is always the whole complex; per-chain control lives in the
  // sequence panel's eye toggles.
  const metaChains = meta.chains || [];
  const ligandChains = metaChains.filter(c => c.ligand);
  if (state.chains.length === 0 && ligandChains.length === 0) {
    seqPanel.classList.remove("show");
  } else {
    renderSequence(null);
  }

  renderMetrics(meta);

  // Enable the style controls. The state.selection state was restored at the top
  // of this function, before applyStyle() painted from it.
  stylePicker.disabled = false;
  colorPicker.disabled = false;
  ligandStylePicker.disabled = ligandChains.length === 0;
  resetBtn.disabled = false;
  viewer.removeAllLabels();
  // A publish's highlight applies once, when the structure arrives. On a
  // tab switch it would re-add residues the user has since dismissed, so
  // it is skipped when restoring a saved snapshot.
  if (!snap) applyHighlights(meta);
  renderSelectionPanel();
}

// A skill can ask for residues to be highlighted on publish, so the user
// sees what was just changed without hunting for it. current.json carries
//
//   "highlight": [{"chain": "A", "resi": 385}, ...]
//
// and those residues are selected exactly as if the user had clicked them
// — same colours, same panel rows, same state.selection.json. The user can then
// dismiss them individually or clear the lot.
//
// Residues that are not in the loaded model are skipped rather than
// erroring: a skill may name a residue the published structure does not
// contain (a chain it dropped, a numbering that shifted).
function applyHighlights(meta) {
  const wanted = meta.highlight;
  if (!Array.isArray(wanted) || !wanted.length) return;

  const model = viewer.getModel();
  if (!model) return;
  const atoms = model.atoms || [];
  const byKey = {};
  atoms.forEach(a => { byKey[selKey(a)] = a; });

  wanted.forEach(w => {
    if (!w || !w.chain || w.resi === undefined) return;
    const key = `${w.chain}:${w.resi}`;
    const atom = byKey[key];
    if (!atom) return;
    if (state.selection[key]) return;
    state.selection[key] = {
      sel: { chain: atom.chain, resi: atom.resi },
      label: selLabel(atom),
      color: nextColor(atom.chain),
    };
  });
  applyStyle();
}

/* ---------------- style controls ---------------- */

// A blue-white palette, keyed by chain ID. Chains beyond the list fall
// back to the last entry, so a structure with more chains than colours
// A blue-to-white ramp, keyed by chain ID. Chains beyond the list fall back
// to the last entry, so a structure with more chains than colours still
// renders. Chosen over a 3Dmol gradient because CustomLinear does not apply
// to cartoon rendering in this build.
//
// The ramp starts light and ends white. A ramp that begins at a saturated
// navy looks uniformly dark on a two- or three-chain complex, since those
// only ever use the first few entries — the pale end has to be reachable
// from the start, not reserved for the eighth chain.
const BLUE_WHITE = ["#7dd3fc", "#bae6fd", "#e0f2fe", "#f0f9ff",
                    "#ffffff", "#ffffff", "#ffffff", "#ffffff"];

// `chains` is the array from extractChains: [{chain, seq, residues}]. The
// key is the chain ID string, not the object — using the object made every
// entry "[object Object]" and the whole structure rendered in one colour.
function chainColorMap(chains) {
  const map = {};
  (chains || []).forEach((c, i) => {
    const id = typeof c === "string" ? c : c.chain;
    if (id == null) return;
    map[id] = BLUE_WHITE[Math.min(i, BLUE_WHITE.length - 1)];
  });
  return map;
}

// Secondary structure follows the same ramp: helices deepest, sheets mid,
// coils the palest — so the fold is legible without leaving the palette.
const SS_BLUE_WHITE = { h: "#38bdf8", s: "#bae6fd", c: "#f0f9ff" };

// Element colours for the per-atom styles (stick, sphere, line). A
// chain-coloured stick render makes every atom the same colour, which
// hides the chemistry; these keep O, N and S readable while staying in a
// cool palette. Jmol's own element colours are the reference here.
const ELEMENT_COLORS = {
  C: "#9ca3af", N: "#2563eb", O: "#ef4444", S: "#eab308",
  H: "#f8fafc", P: "#0ea5e9", SE: "#f59e0b", FE: "#f97316",
};

// Same hues, lifted in brightness, for a selected ligand. Flattening to a
// single highlight colour destroys the O/N/C readout, and merely making
// the sticks thicker looks clumsy — a brighter version of the same palette
// says "selected" while keeping the chemistry legible.
const ELEMENT_COLORS_HI = {
  C: "#e5e7eb", N: "#60a5fa", O: "#fb7185", S: "#fde047",
  H: "#ffffff", P: "#38bdf8", SE: "#fbbf24", FE: "#fb923c",
};

// Blend a hex colour toward another by t (0 = base, 1 = target).
function mixHex(base, target, t) {
  const b = parseInt(base.slice(1), 16);
  const g = parseInt(target.slice(1), 16);
  const r = Math.round(((b >> 16) & 255) * (1 - t) + ((g >> 16) & 255) * t);
  const gr = Math.round(((b >> 8) & 255) * (1 - t) + ((g >> 8) & 255) * t);
  const bl = Math.round((b & 255) * (1 - t) + (g & 255) * t);
  return "#" + ((1 << 24) | (r << 16) | (gr << 8) | bl).toString(16).slice(1);
}

// Element colours tinted toward the user's state.selection colour. The molecule
// keeps its O/N/C identity but visibly carries the state.selection colour, which
// is what the swatch in the Selection panel promises.
function elementColorsTinted(selColor, t = 0.55) {
  const out = {};
  for (const [el, hex] of Object.entries(ELEMENT_COLORS)) {
    out[el] = mixHex(hex, selColor, t);
  }
  return out;
}

// 3Dmol distinguishes two style fields: `color` takes a literal colour
// ("red", "#ff0000") while `colorscheme` takes the name of a built-in
// scheme. Passing a scheme name to `color` logs "color not found" for
// every atom and falls back to the default.
//
// "spectrum" is the exception — it is a gradient, not an entry in the
// scheme table, and only works through `color`. Verified by pixel count:
// color:"spectrum" gives 63% coloured pixels, colorscheme:"spectrum" 13%.
//
// `perAtom` selects element colours instead of the chain/secondary
// scheme, for styles that draw individual atoms.
function colorSpec(scheme, chains, perAtom = false) {
  if (perAtom) {
    return { colorscheme: { prop: "elem", map: ELEMENT_COLORS } };
  }
  switch (scheme) {
    case "chain":
      return { colorscheme: { prop: "chain", map: chainColorMap(chains) } };
    case "secondary":
      return { colorscheme: { prop: "ss", map: SS_BLUE_WHITE } };
    default:          return { color: "spectrum" };
  }
}

function styleSpec(kind, scheme, chains) {
  // stick/sphere/line draw atoms, so they get element colours; cartoon and
  // surface draw the fold, so they keep the chain/secondary scheme.
  const perAtom = (kind === "stick" || kind === "sphere" || kind === "line");
  const color = colorSpec(scheme, chains, perAtom);
  // 3Dmol's default lighting is a single hard key light, which carves deep
  // shadows out of a surface and buries anything inside a pocket. A strong
  // ambient term lifts the shadow side to a mid tone rather than black, and
  // the emission keeps the pale end of the ramp reading as white instead of
  // grey.
  const soft = { ...color, ambientColor: "#c8d6e8", emissiveColor: "#5b6b80" };
  switch (kind) {
    case "stick":   return { stick: { ...color, radius: 0.18 } };
    case "sphere":  return { sphere: { ...color, scale: 0.5 } };
    case "line":    return { line: { ...color, linewidth: 2 } };
    case "surface": return { cartoon: soft, surface: { opacity: 0.15, color: "white", ambientColor: "#7f8ea3" } };
    default:        return { cartoon: soft, stick: {} };
  }
}

// How a small molecule is drawn. Jmol element colours throughout — blue
// N, red O, grey C — the convention chemists read at a glance, and it
// keeps the ligand distinguishable from a protein coloured by chain.
//
// `thick` is set when the protein is drawn as a surface: that shell is
// depth-sorted and opaque, so anything inside the pocket needs extra
// visual weight to read through it.
// A ligand chain's rendering style, chosen independently of the protein's.
//
// This is the style the user picked, applied as-is. Isolated atoms — metal
// ions — need a sphere on top, because stick and line render only bonds and
// a single atom has none; that is added by the caller, per atom, so a
// bonded molecule's appearance is untouched.
function ligandStyleSpec(kind, thick) {
  switch (kind) {
    case "stick":
      return { stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" } };
    case "spacefill":
      return { sphere: { scale: thick ? 0.55 : 0.45, colorscheme: "Jmol" } };
    case "line":
      return { line: { linewidth: thick ? 4 : 3, colorscheme: "Jmol" } };
    case "ballstick":
    default:
      return {
        stick: { radius: thick ? 0.3 : 0.22, colorscheme: "Jmol" },
        sphere: { scale: thick ? 0.42 : 0.32, colorscheme: "Jmol" }
      };
  }
}

// The sphere an isolated atom needs to be visible at all. A metal ion has
// no bonds, and stick and line draw only bonds, so without this a zinc ion
// renders as nothing while the chain panel lists it as a ligand.
const ION_SPHERE = { sphere: { scale: 0.32, colorscheme: "Jmol" } };

// True when an atom has no bonds to anything — a lone ion rather than part
// of a molecule.
function isIsolatedAtom(atom) {
  return !atom.bonds || atom.bonds.length === 0;
}

// How a selected residue is marked. It has to match the style the protein
// is drawn in, otherwise the highlight replaces that residue's rendering
// and looks detached — sticks over a surface float outside the shell.
//
// Every case also draws the side chain as sticks. A residue selected in a
// surface or cartoon view is otherwise just a patch of colour, which says
// "here" but not "what is here" — and the side chain is what a mutation
// actually changes. The backbone representation is kept underneath, so the
// residue stays in context rather than being replaced by loose sticks.
function selectionHighlightSpec(kind) {
  const sidechain = { stick: { radius: 0.22, colorscheme: "Jmol" } };
  switch (kind) {
    case "surface":
      return { cartoon: {}, surface: { opacity: 0.85 }, ...sidechain };
    case "stick":
      return { stick: { radius: 0.3 }, ...sidechain };
    case "sphere":
      return { sphere: { scale: 0.6 }, ...sidechain };
    case "line":
      return { line: { linewidth: 5 }, ...sidechain };
    default:
      return { cartoon: {}, stick: { radius: 0.25 }, ...sidechain };
  }
}

// Hover preview: the same treatment a click would apply, at reduced
// opacity, so the user sees what selecting this residue would look like
// before committing to it.
//
// The side chain is drawn in Jmol element colours rather than the hover
// tint — a preview that flattens the chemistry tells the user less than
// the residue's own O/N/C readout does.
function hoverHighlightSpec(kind) {
  const spec = selectionHighlightSpec(kind);
  const out = {};
  for (const [k, v] of Object.entries(spec)) {
    if (k === "stick" && v.colorscheme) {
      out[k] = { ...v };                       // side chain keeps its colours
    } else if (k === "surface") {
      out[k] = { ...v, color: HOVER_COLOR };
    } else {
      out[k] = { ...v, color: HOVER_COLOR };
    }
  }
  return out;
}

const HOVER_COLOR = "#93c5fd";
// How long the pointer must rest on a residue before the 3D preview
// appears. Long enough that sweeping across the structure does not
// repaint every residue it crosses; short enough to feel immediate.
const HOVER_PREVIEW_MS = 100;
let hoverPreviewTimer = null;
// Whether a preview is currently painted. 3Dmol fires hover-out only when
// the pointer leaves the model, so moving between residues has to clear
// the previous preview itself.
let hoverPreviewed = false;

// What the hover preview applies to, per selection mode. In res mode it is
// the residue; in atom/bond mode it is the atom or bond under the cursor,
// matching what a click would select.
// What the hover preview covers. Always the whole residue, in every mode.
//
// In atom and bond mode a click selects one atom or one bond, but that is
// a poor thing to preview: a lone atom is a dot with no context, and the
// user is usually asking "what is this residue" rather than "what is this
// atom". The residue carries the side chain and the backbone, which is
// what makes the preview readable. The narrower selection still happens
// on click — only the preview is wider.
function hoverSel(atom) {
  return { chain: atom.chain, resi: atom.resi };
}

// The selection key the hovered thing would occupy, so the preview can be
// suppressed when it is already selected.
// Whether the hovered residue already carries a selection, so the preview
// can be suppressed. Residue-level in every mode, matching what hoverSel
// paints: an atom or bond selected anywhere in this residue counts, since
// the real highlight is stronger than the preview and repainting over it
// would flicker.
function hoverAlreadySelected(atom) {
  const resKey = `${atom.chain || "_"}:${atom.resi}`;
  if (state.selection[resKey] || state.selection[`chain:${atom.chain}`]) {
    return true;
  }
  // Atom and bond selections are keyed by index, so scan for one whose
  // atom belongs to this residue.
  return Object.values(state.selection).some(item => {
    if (!item.atom && !item.bond) return false;
    const idx = Array.isArray(item.sel.index) ? item.sel.index : [item.sel.index];
    return idx.some(i => {
      const a = viewer.getModel().atoms.find(x => x.index === i);
      return a && a.chain === atom.chain && a.resi === atom.resi;
    });
  });
}

function applyStyle() {
  const kind = stylePicker.value;
  const scheme = colorPicker.value;

  viewer.setStyle({}, {});

  // Every chain keeps the chosen style; picking one only moves the camera
  // onto it, so the rest of the complex stays on screen for context.
  viewer.setStyle({}, styleSpec(kind, scheme, state.chains.map(c => c.chain)));

  // Ligands (non-amino-acid chains from metadata) get their own rendering
  // style, chosen independently of the protein's, so a small molecule
  // stays legible inside a structure of thousands of atoms.
  // current.json chains carry "id", not "chain" — see publish.py.
  const ligandChains = (state.meta.chains || [])
    .filter(c => c.ligand)
    .map(c => c.id);
  if (ligandChains.length) {
    const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
    ligandChains.forEach(ch => viewer.setStyle({ chain: ch }, spec));
    // A lone ion has no bonds, so stick and line draw nothing for it. Give
    // those atoms a sphere of their own; bonded molecules are untouched.
    // `index` is 3Dmol's own atom index — `serial` is the PDB atom number,
    // which is a different thing and selects nothing here.
    const ions = (viewer.getModel().atoms || []).filter(
      a => ligandChains.includes(a.chain) && isIsolatedAtom(a));
    if (ions.length) {
      viewer.setStyle({ index: ions.map(a => a.index) }, ION_SPHERE);
    }
  }

// Alpha-sphere clouds from fpocket are a point set, not a molecule: the
// atoms have no bonds between them, so a stick render draws nothing but
// isolated dots and a ball-and-stick adds stray spheres. Spheres alone
// read as the cavity's shape, which is what they are.
//
// White rather than a hue: the cloud sits on top of a protein already
// coloured by chain, and a saturated default competes with it. White reads
// as "cavity" without taking a side, and leaves the selection colours
// free to mean "chosen".
//
// Opacity has to clear two bars at once: high enough that the cloud
// reads as a volume against the surface shell, low enough that the
// lining residues stay visible through it. 0.55 washed out to nothing.
const POCKET_SPHERE = { scale: 0.35, color: "#ffffff", opacity: 0.85 };

viewer.setStyle({ resn: "STP" }, { sphere: { ...POCKET_SPHERE } });

  // Hidden chains get an empty style, which removes them from the render
  // without touching the model — so toggling the eye is reversible.
  // This has to come last: the ligand block above would otherwise re-style
  // a hidden ligand and undo the hide.
  state.hiddenChains.forEach(ch => viewer.setStyle({ chain: ch }, {}));

  // A selected ligand keeps exactly the geometry it already had; only the
  // element colours change, each tinted toward the user's state.selection colour.
  // Overwriting with one flat tone would destroy the O/N/C readout, and
  // changing the radius makes the molecule look fatter than its neighbours.
  const highlight = selectionHighlightSpec(kind);
  const ligandIds = new Set((state.meta.chains || [])
    .filter(c => c.ligand).map(c => c.id));
  Object.entries(state.selection).forEach(([key, item]) => {
    // A selected pocket takes the state.selection colour and grows slightly.
    // Opacity stays put: changing it reorders 3Dmol's transparent pass and
    // the other pockets fade with it, which reads as "selecting one dims
    // them all". A slightly larger sphere in the selection colour marks
    // the chosen one without touching the render queue.
    if (item.pocket) {
      viewer.setStyle(item.sel, {
        sphere: { scale: 0.45, color: item.color, opacity: 0.85 },
      });
      return;
    }
    // A single atom or a bond: keep the geometry exactly as it was and
    // only shift the element colours toward the state.selection colour. Scaling
    // the sphere up made the atom look like a different, larger atom
    // rather than the same one marked; tinting says "selected" while the
    // O/N/C readout and the size stay honest.
    if (item.atom || item.bond) {
      const map = elementColorsTinted(item.color);
      viewer.setStyle(item.sel, {
        stick: { radius: item.bond ? 0.3 : 0.22,
                 colorscheme: { prop: "elem", map } },
        sphere: { scale: item.bond ? 0.42 : 0.32,
                  colorscheme: { prop: "elem", map } },
      });
      return;
    }
    if (ligandIds.has(item.sel.chain)) {
      const spec = ligandStyleSpec(ligandStylePicker.value, kind === "surface");
      const map = elementColorsTinted(item.color);
      const styled = {};
      for (const [k, v] of Object.entries(spec)) {
        styled[k] = { ...v, colorscheme: { prop: "elem", map } };
      }
      // A selected ion needs the same treatment an unselected one does, or
      // selecting it makes it vanish.
      if (!styled.sphere) {
        const lone = (viewer.getModel().atoms || []).filter(
          a => a.chain === item.sel.chain && isIsolatedAtom(a));
        if (lone.length) {
          styled.sphere = { ...ION_SPHERE.sphere,
                            colorscheme: { prop: "elem", map } };
        }
      }
      viewer.setStyle(item.sel, styled);
      return;
    }
    const styled = {};
    for (const [k, v] of Object.entries(highlight)) {
      // The side chain keeps Jmol element colours — blue N, red O, grey C
      // — so the residue's chemistry stays legible. Only the backbone
