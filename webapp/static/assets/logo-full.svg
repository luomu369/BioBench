<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <!-- BioBench — the mark and the wordmark, as they appear on the empty
       stage. The mark is the molecule from the viewer; the word is set in
       the same light weight the page uses, so the two read as one thing
       rather than a logo bolted next to a title. -->
  <rect width="640" height="160" fill="none"/>
  <g transform="translate(24 32)">
    <svg viewBox="0 0 48 48" width="96" height="96" fill="none" stroke="#4da3ff"
         stroke-width="1.6" stroke-linecap="round">
      <path d="M24 8 L37 16 L37 32 L24 40 L11 32 L11 16 Z" opacity=".38"/>
      <path d="M24 8 L24 20 M37 16 L27 25 M37 32 L27 25 M11 16 L21 25 M11 32 L21 25"
            opacity=".38"/>
      <circle cx="24" cy="8" r="3.4" fill="#4da3ff" stroke="none"/>
      <circle cx="37" cy="16" r="3.4" fill="#4da3ff" stroke="none"/>
      <circle cx="37" cy="32" r="3.4" fill="#4da3ff" stroke="none"/>
      <circle cx="11" cy="32" r="3.4" fill="#4da3ff" stroke="none"/>
      <circle cx="11" cy="16" r="3.4" fill="#4da3ff" stroke="none"/>
      <circle cx="24" cy="24" r="5.2" fill="#0b0f14" stroke-width="2"/>
    </svg>
  </g>
  <text x="152" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI',
        Helvetica, Arial, sans-serif"
        font-size="64" font-weight="300" fill="#dbe6f0" letter-spacing="1">BioBench</text>
</svg>
